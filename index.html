  .awaken.out { pointer-events: none; background: transparent; animation: awaken-out 1.2s ease-out forwards; }
  .awaken.out .aw-wake { animation: none; }
  @keyframes awaken-out { to { opacity: 0; } }
  /* 有圖的劇情段落:圖鋪滿上方,文字壓在圖的下緣(跟戰鬥畫面一樣) */
  .child-scene {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    container-type: size;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0a0705;
  }
  .child-scene::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 40px rgba(0,0,0,.6); pointer-events: none; }
  .child-scene .scene-text {
    position: relative;
    z-index: 1;
    max-height: 62%;
    overflow-y: auto;
    padding: 40px 20px 4px;
    background: linear-gradient(180deg, transparent, rgba(12,9,6,.82) 38%, rgba(12,9,6,.94));
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  /* 段落的圖(見 sceneStage):跟 background-size: cover 一樣鋪滿,對齊點是 content.js 的 artPos(--px、--py)。
     這樣才能在圖上的固定位置疊東西:會動的手(wave)以手腕為軸左右擺,像在你眼前晃 */
  .scene-stage {
    position: absolute;
    width: max(100cqw, calc(100cqh * var(--ar)));
    aspect-ratio: var(--ar);
    left: calc((100cqw - max(100cqw, calc(100cqh * var(--ar)))) * var(--px) / 100);
    top: calc((100cqh - max(100cqh, calc(100cqw * var(--ari)))) * var(--py) / 100);
  }
  .scene-stage img { position: absolute; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .scene-base { inset: 0; width: 100%; height: 100%; }
  .scene-wave { height: auto; animation: scene-wave 4s ease-in-out .6s infinite; }
  @keyframes scene-wave {
    0%, 40%, 100% { transform: rotate(0); }
    8% { transform: rotate(-6deg); }
    16% { transform: rotate(5deg); }
    24% { transform: rotate(-4deg); }
    32% { transform: rotate(2deg); }
  }
  /* 劇情畫面裡的圖慢慢呼吸(微微推近再退回) */
  .child-scene .scene-stage { transform-origin: 60% 35%; animation: scene-breathe 9s ease-in-out infinite alternate; }
  @keyframes scene-breathe { to { transform: scale(1.025); } }
  /* 窗外飄進來的花瓣 */
  .scene-petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .scene-petals b {
    position: absolute;
    top: -6%;
    left: var(--x);
    width: var(--s);
    height: calc(var(--s) * .6);
    border-radius: 60% 0 60% 0;
    background: #f7c1cf;
    opacity: .85;
    animation: scene-petal var(--d) linear var(--delay) infinite;
  }
  @keyframes scene-petal {
    from { transform: translate(0, 0) rotate(0); }
    to { transform: translate(var(--dx), 110cqh) rotate(400deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene-stage, .scene-wave, .scene-petals b { animation: none !important; }
    .battle, .battle *, .fade-in { animation: none !important; transition: none !important; }
    .b-float, .b-fx, .b-intro, .pick-fx, .pick-ghost { display: none; }
  }
</style>
</head>
<body>
<!-- 底部選項框兩端的石雕(暫代向量圖,之後換成美術素材) -->
<svg class="defs" width="0" height="0" aria-hidden="true">
  <defs>
    <!-- 石雕質感:用模糊後的輪廓當高度圖、混一點雜訊,再打斜光 -->
    <filter id="orn-carve" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="soft"/>
      <feComposite in="soft" in2="grain" operator="arithmetic" k1="0" k2="1" k3="0.18" k4="0" result="height"/>
      <feDiffuseLighting in="height" surfaceScale="5" diffuseConstant="1.15" lighting-color="#efe6d8" result="lit">
        <feDistantLight azimuth="225" elevation="40"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceAlpha" operator="in" result="litShape"/>
      <feBlend in="SourceGraphic" in2="litShape" mode="multiply"/>
    </filter>
    <filter id="orn-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 青銅像:凸起處打金色高光,凹處偏暗 -->
    <linearGradient id="orn-bronze-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39552"/>
      <stop offset=".5" stop-color="#6e4a20"/>
      <stop offset="1" stop-color="#2c1c0a"/>
    </linearGradient>
    <filter id="orn-bronze" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="7" result="grain"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="soft"/>
      <feComposite in="soft" in2="grain" operator="arithmetic" k1="0" k2="1" k3="0.12" k4="0" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="3.5" diffuseConstant="1.05" lighting-color="#ffffff" result="diff">

<script>
/* ============================================================
   逆仙之境 引擎(beta)
   目前只實作:序章首戰 -> 選身份 -> 世界觀開場 -> 碰撞劇情 -> 心魔試煉 -> 結果
   之後的場景流/戰鬥/道具系統尚未接上,先驗證這條管線走得通
   ============================================================ */

// beta 階段先開放這 5 個身份(都已有完整 collision/innerDemon)
const BETA_IDENTITY_IDS = ["farmer", "wrestler", "miner", "boatman", "blacksmith"];

// 分類 -> 屬性加成表(數字為暫定預設值,之後可直接調整)
const CATEGORY_ATTR_BONUS = {
  "體質": { "體質": 5 },
  "根骨": { "根骨": 5 },
  "體魄": { "體魄": 5 },
  "悟性": { "悟性": 5 },
  "氣運": { "氣運": 5 },
  "靈根": { "靈根": 5 },
  "身法": { "身法": 5 },
  "全能": { "體質": 2, "根骨": 2, "體魄": 2, "悟性": 2, "氣運": 2, "靈根": 2, "身法": 2 },
  "無徵兆": {}
};

const BASE_ATTRS = { "體質": 10, "根骨": 10, "體魄": 10, "悟性": 10, "氣運": 10, "靈根": 10, "身法": 10 };

// 每個屬性管什麼(2026-10-20 定案),顯示在「查看自身」
const ATTR_EFFECTS = {
  "體質": "氣血", "根骨": "防禦", "體魄": "普通攻擊", "悟性": "術法閃避、術法傷害",
  "氣運": "奇遇", "靈根": "靈力", "身法": "物理閃避、速度"
};

// 善惡值/情理值:0~100,50 是正中間;畫面上只顯示善惡值的模糊橫條
const TENDENCY_STEP = 15; // 一次心魔抉擇推動情理值的幅度(暫定)

// 這些畫面上方會出現「查看自身」(序章首戰另外放在戰鬥畫面頂端)
const STATUS_PHASES = ["collision", "trial", "trialResult", "loop", "loopResult", "summary"];

function buildAttributes(category) {
  const attrs = { ...BASE_ATTRS };
  const bonus = CATEGORY_ATTR_BONUS[category] || {};
  for (const k in bonus) attrs[k] += bonus[k];
  return attrs;
}

const ROUND_LIMIT = 5; // demo場景流玩幾輪就結束,之後接正式場景流時拿掉

const state = {
  phase: "title",
  identity: null,
  attributes: null,
  realm: "練氣期",
  innerDemonChoice: null,
  cultivation: 0,
  round: 0,
  currentScene: null,
  lastChoiceResult: null,
  battle: null,
  qingli: 50,   // 情理值:越小越牽掛紅塵,越大越無情合道(不顯示在畫面上)
  morality: 50, // 善惡值:越小越善良,越大越邪惡(來源尚未定義)
  statusOpen: false,
  statusSlide: false,
  introStyle: "4", // 測試用:序章首戰的進場演出 1~4,選定後拿掉
  attackStyle: null, // 測試用:普通攻擊改用斬擊 slash／拳擊 punch 預覽,null = 照 content.js
  testsOpen: false,  // 測試切換列是否展開
  ornament: "bronze", // 測試用:選項框的外框 bronze/dragon/skull/none,選定後拿掉
  // 測試用:舞台特效一項一項開關(見 STAGE_FX),比對完再決定留哪些
  stageFx: { push: true, dust: true, edge: true, scene: true, rune: true },
  font: "wenkai",   // 測試用:wenkai 霞鶩文楷 / serif 思源宋體 / old 舊版(新細明體)
  uiStyle: "new",   // 測試用:new 照設計圖的名號牌、紅綢標籤、刻字選項 / old 舊版
  barStyle: "hex",  // 測試用(新版介面):氣血、靈力條的樣子 hex 六角刀形 / plain 純細框
  soulEcho: "record", // 測試用:前世殘念 record 照紀錄(上一輪選錯的回合才出現) / force 每回合都出現 / off 關
  hint: "on",       // 測試用:亮光提示 on = 每回合正解的指令和抽屜裡那一項外框亮起 / off 關
  awaken: null      // 第一次進遊戲的開場:"intro" 播放中、"out" 播完正在淡出、null 沒有
};

function pickWeighted(list) {
  const total = list.reduce((sum, item) => sum + item.weight, 0);
  let r = Math.random() * total;
  for (const item of list) {
    if (r < item.weight) return item;
    r -= item.weight;
  }
  return list[list.length - 1];
}

function getIdentity(id) {
  return CONTENT.identities.find(i => i.id === id);
}

function startRun(identityId) {
  const identity = getIdentity(identityId);
  state.identity = identity;
  state.attributes = buildAttributes(identity.category);
  state.realm = "練氣期";
  state.innerDemonChoice = null;
  state.cultivation = 0;
  state.round = 0;
  state.qingli = 50;
  state.morality = 50;
  state.phase = "opening";
  render();
}

function goToCollision() {
  state.phase = "collision";
  render();
}

function goToTrial() {
  if (state.identity.innerDemon) {
    state.phase = "trial";
  } else {
    goToLoop();
    return;
  }
  render();
}

function chooseInnerDemon(type) {
  state.innerDemonChoice = type; // "indulge" | "resist"
  // 順從偏向牽掛紅塵,壓制偏向無情合道
  const shift = type === "indulge" ? -TENDENCY_STEP : TENDENCY_STEP;
  state.qingli = Math.min(100, Math.max(0, state.qingli + shift));
  state.phase = "trialResult";
  render();
}

function goToLoop() {
  if (state.round >= ROUND_LIMIT) {
    state.phase = "summary";
    render();
    return;
  }
  state.currentScene = pickWeighted(CONTENT.demoScenes);
  state.phase = "loop";
  render();
}

function chooseSceneOption(choice) {
  state.cultivation += choice.cultivationGain;
  state.round += 1;
  state.lastChoiceResult = choice;
  state.phase = "loopResult";
  render();
}

function restart() {
  state.phase = "title";
  state.identity = null;
  state.attributes = null;
  state.cultivation = 0;
  state.round = 0;
  render();
}

/* ---------- 序章首戰(資料在 content.js 的 prologueBattle) ---------- */

const BATTLE_ICONS = {
  attack: '<svg viewBox="0 0 24 24"><path d="M4 20L15 9M15 9l3-5 2 2-5 3M7 14l3 3M5 19l-1 1"/></svg>',
  item: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M12 10c-5 1-6 5-6 7a6 4 0 0 0 12 0c0-2-1-6-6-7M12 4V2"/></svg>',
  spell: '<svg viewBox="0 0 24 24"><path d="M12 12a2 2 0 1 1 2-2 4 4 0 1 1-4-4 6 6 0 1 1-6 6"/></svg>',
  flee: '<svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg>'
};

const LOG_LINES = 5; // 戰鬥紀錄只保留最近幾行
const DUSK_MS = 4100; // 分出勝負後,黑暗籠罩多久才切到下一個畫面(CSS b-dusk 延遲 1.4s + 2.6s)
const REVEAL_MS = 1300; // 最後一劍的演出播完,金身才裂開
const KILL_MS = 2800; // 真身露出來之後,多久出手
const ALLY_CUT_MS = 2600; // 夥伴出手特寫的長度(CSS ally-cut 延遲 .8s + 1.7s,再留一點)

// 目前這場戰鬥的設定:序章首戰(content.js 的 prologueBattle)或桃花村的教學戰(childBattle)
function battleDef() {
  return (state.battle && state.battle.def) || CONTENT.prologueBattle;
}

function startPrologue(def = CONTENT.prologueBattle) {
  const P = def;
  const items = {};
  P.items.forEach(it => { items[it.id] = it.count; });
  state.battle = {
    def: P,
    turn: 0, hp: P.hp, mp: P.mpMax, items,
    revealed: false, log: [], freshFrom: 0, menu: null, result: null,
    // 身上的狀態 [{ name, left }],left = 還會發作幾次;chipOpen = 正在看哪個狀態的說明
    statuses: [], chipOpen: null,
    // 演出用:上一刻的氣血/靈力(讓條往下掉)、這一回合要播的效果、演出播完前不接受操作
    prevHp: P.hp, prevMp: P.mpMax, fx: null, lockUntil: 0, introPending: true,
    // 選項回饋:picked = 剛剛選的指令(亮一下)、last = 上次用的指令(一直留著記號)、
    // usable = 上一刻能用的術法和道具、fresh = 這一刻才變成能用的(外框亮起)
    picked: null, last: null, usable: [], fresh: [],
    // 前世殘念:wrongTurns = 這一輪選錯的回合,echo = 前幾輪記下的(這些回合魂火會指路),echoTurn = 這回合播過了
    wrongTurns: [], echo: P.soulEcho === false ? [] : loadEcho(), echoTurn: -1,
    // 夥伴(自動援戰):charge = 已經集了幾回合,集滿 ally.every 就在回合結束時出手
    ally: { charge: 0 }
  };
  state.battle.usable = usableTools(state.battle);
  battleLog(P.opening, "enemy");
  battleLog(P.turns[0].telegraph, "enemy");
  state.phase = "prologue";
  render();
}

// who:"you" 你的行動、"enemy" 它的行動/預兆、"ally" 援手的行動、"system" 提示(數值變化等)、不填 = 上一句行動的結果
// value:提示行後面的數字,例如「−100」;文字裡的 {name} 換成玩家取的名字
function battleLog(text, who, value) {
  state.battle.log.push({ text: fillName(text), who, value, turn: state.battle.turn }); // turn:回看紀錄依回合分段
}

function findTool(id) {
  const P = battleDef();
  if (id === "attack") return P.attack;
  return P.spells.find(s => s.id === id) || P.items.find(i => i.id === id);
}

// 現在能用的術法(靈力夠)和道具(還有剩)
function usableTools(b) {
  const P = battleDef();
  return [...P.spells.filter(s => b.mp >= s.cost), ...P.items.filter(i => b.items[i.id] > 0)].map(t => t.id);
}

function battleAct(id) {
  const P = battleDef();
  const b = state.battle;
  if (Date.now() < b.lockUntil) return; // 上一下的演出還沒播完
  const turn = P.turns[b.turn];
  const tool = findTool(id);
  const lastTurn = b.turn === P.turns.length - 1;
  b.picked = b.last = id === "attack" ? "attack" : P.spells.some(s => s.id === id) ? "spell" : "item";

  b.freshFrom = b.log.length;
  b.menu = null;
  b.chipOpen = null;
  b.prevHp = b.hp;
  b.prevMp = b.mp;
  b.fx = { shield: !!tool.shield };
  const already = b.statuses.slice(); // 這回合之前就在身上的狀態,回合結束時才發作
  b.lockUntil = Date.now() + 800;
  if (tool.cost) b.mp -= tool.cost;
  if (id in b.items) {
    b.items[id] -= 1;
    if (tool.mp) b.mp = Math.min(P.mpMax, b.mp + tool.mp);
  }
  battleLog(tool.use, "you");
  if (id !== turn.answer && !b.wrongTurns.includes(b.turn)) b.wrongTurns.push(b.turn);

  if (id === turn.answer && turn.failUnrevealed && !b.revealed) {
    battleLog(turn.failUnrevealed);
    b.result = "lose";
  } else if (id === turn.answer) {
    battleLog(turn.success);
    if (tool.shield) {
      b.fx.block = true;
      battleLog("你擋下了這一擊", "system");
    }
    if (turn.onWrong === "reveal") b.revealed = true;
    // 打贏了:有真身的(序章)接著金身裂開、真身出手(revealTrueForm),沒有的直接打贏
    if (lastTurn) { if (P.reveal) b.ending = true; else b.result = "win"; }
  } else if (turn.onWrong === "hp" && b.statuses.some(s => s.name === "花蔭")) {
    // 夥伴種下的花蔭:替你擋掉這一下,用掉就沒了
    b.statuses = b.statuses.filter(s => s.name !== "花蔭");
    b.fx.block = true;
    battleLog(turn.fail);
    battleLog("花瓣替你擋下了這一擊", "system");
  } else if (turn.onWrong === "hp") {
    b.hp = Math.max(P.cannotLose ? 1 : 0, b.hp - P.wrongDamage); // 打不輸的戰鬥(教學戰)氣血最少剩 1
    b.fx.hurt = P.wrongDamage;
    battleLog(turn.fail);
    battleLog("你的氣血", "system", `−${P.wrongDamage}`);
    if (b.hp <= 0) b.result = "lose";
  } else {
    battleLog(turn.fail);
  }
  if (id !== turn.answer && turn.wrongStatus && !b.result) {
    const { name, turns } = turn.wrongStatus;
    b.statuses.push({ name, left: turns });
    b.fx.gained = name;
    battleLog(`你${name}了，持續 ${turns} 回合`, "system");
  }
  if (!b.result && !b.ending) tickStatuses(b, already);
  // 攻擊演出:選對才算打中(最後一回合沒破妄,劍光斬在幻影上也算落空)
  if (tool.strike) {
    const hit = id === turn.answer && !(turn.failUnrevealed && !b.revealed);
    b.fx.attack = { style: (id === "attack" && state.attackStyle) || tool.fx || "slash", hit };
  }
  if (P.ally && !b.result && !b.ending && !lastTurn) allyTurnEnd(P, b);
  const usable = usableTools(b);
  b.fresh = usable.filter(t => !b.usable.includes(t));
  b.usable = usable;

  if (!b.result && !b.ending && lastTurn) b.result = P.cannotLose ? "win" : "lose";
  // 打贏時夥伴收尾:一樣有出手特寫,黑幕晚一點落下,讓特寫和這句話看得完
  if (b.result === "win" && P.ally && P.ally.finale) {
    battleLog(P.ally.finale.text, "ally");
    b.fx.allyCut = P.ally.finale.name;
    b.duskDelay = ALLY_CUT_MS;
  }
  if (!b.result && !b.ending) {
    b.turn += 1;
    battleLog(P.turns[b.turn].telegraph, "enemy");
  }
  render();
  if (b.ending) {
    b.lockUntil = Infinity;
    setTimeout(revealTrueForm, REVEAL_MS);
  } else if (b.result) setTimeout(finishPrologue, DUSK_MS + (b.duskDelay || 0));
}

// 夥伴(自動援戰):每回合結束集一格,集滿 every 格就出手一次,依情況挑招
// (受了傷先補血、靈力不滿就補靈力,都滿就種花蔭替你擋一次傷害),出手時有一段橫幅特寫
function allyTurnEnd(P, b) {
  const A = P.ally;
  b.ally.charge += 1;
  if (b.ally.charge < A.every) return;
  b.ally.charge = 0;
  const sk = A.skills.find(k => k.when === "hurt" ? b.hp < P.hp : k.when === "tired" ? b.mp <= P.mpMax / 2 : true);
  battleLog(sk.text, "ally");
  if (sk.hp) {
    const v = Math.min(sk.hp, P.hp - b.hp);
    b.hp += v;
    b.fx.allyHeal = v;
    battleLog("你的氣血", "system", `+${v}`);
  }
  if (sk.mp) {
    const v = Math.min(sk.mp, P.mpMax - b.mp);
    b.mp += v;
    b.fx.allyMp = v;
    battleLog("你的靈力", "system", `+${v}`);
  }
  if (sk.status) {
    b.statuses = b.statuses.filter(s => s.name !== sk.status).concat({ name: sk.status, left: 3 });
    b.fx.gained = sk.status;
    battleLog(`你得到了${sk.status}，持續 3 回合`, "system");
  }
  b.fx.allyCut = sk.name;
  b.lockUntil = Date.now() + ALLY_CUT_MS; // 特寫播完才接受下一個動作
}

// 打贏之後:金身沿劍痕裂開,露出第二階段(真身),它隨即出手,這一下必死(劇情殺)
function revealTrueForm() {
  const P = battleDef();
  const b = state.battle;
  if (state.phase !== "prologue") return;
  b.trueForm = true;
  b.freshFrom = b.log.length;
  b.fx = { reveal: true };
  P.reveal.forEach(text => battleLog(text, "enemy"));
  render();
  setTimeout(trueFormStrike, KILL_MS);
}

function trueFormStrike() {
  const P = battleDef();
  const b = state.battle;
  if (state.phase !== "prologue") return;
  b.freshFrom = b.log.length;
  b.fx = { hurt: b.hp };
  battleLog(P.killText, "enemy");
  battleLog("你的氣血", "system", `−${b.hp}`);
  b.hp = 0;
  b.result = "win";
  render();
  setTimeout(finishPrologue, DUSK_MS);
}

// 回合結束:list 裡的狀態各發作一次、剩餘次數減一,用完就解除
function tickStatuses(b, list) {
  list.forEach(s => {
    const def = CONTENT.statusEffectCatalog[s.name];
    if (def.hpPerTurn) {
      b.hp = Math.max(0, b.hp - def.hpPerTurn);
      b.fx.dot = { name: s.name, amount: def.hpPerTurn };
      battleLog(`${s.name}發作，你的氣血`, "system", `−${def.hpPerTurn}`);
    }
    s.left -= 1;
    if (s.left === 0) battleLog(`${s.name}解除`, "system");
  });
  b.statuses = b.statuses.filter(s => s.left > 0);
  if (b.hp <= 0) b.result = "lose";
}

function battleFlee() {
  const b = state.battle;
  if (Date.now() < b.lockUntil) return;
  b.freshFrom = b.log.length;
  b.menu = null;
  b.fx = {};
  b.picked = b.last = "flee";
  battleLog(battleDef().fleeText, "you");
  if (battleDef().noFlee) { render(); return; } // 這場不能逃:只說一句話
  b.result = "lose";
  render();
  setTimeout(finishPrologue, DUSK_MS);
}

function finishPrologue() {
  if (state.phase !== "prologue") return;
  const b = state.battle;
  const P = battleDef();
  // 桃花村的教學戰:打完接回桃花村
  if (P.next) {
    state.phase = "child";
    state.childNode = P.next;
    render();
    return;
  }
  // 前世殘念:打輸就把這一輪選錯的回合加進紀錄,打贏就清掉
  if (P.soulEcho === false) { /* 這場不記 */ }
  else if (b.result === "win") saveEcho([]);
  else if (b.wrongTurns.length) saveEcho([...new Set([...loadEcho(), ...b.wrongTurns])]);
  // 序章戰鬥只打一次:打完(不管輸贏)之後的輪迴從選身份開始
  if (player) { player.prologueDone = true; savePlayer(); }
  state.phase = "prologueEnd";
  render();
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "onclick") e.addEventListener("click", attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => {
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  });
  return e;
}

function panel(children) {
  return el("div", { class: "panel" }, children);
}

function choiceButton(label, onclick) {
  const btn = el("button", { class: "choice" }, [el("span", { class: "cl" }, [label])]); // .cl:新版介面的刻字填在這層
  btn.addEventListener("click", () => pick(btn, onclick));
  return btn;
}

// 點了選項:被選的那個亮一下(金光掃過)、殘影往外散,其他選項淡掉,停一下才換畫面;
// 停的時候整組選項不接受點擊(參考女神異聞錄 5、崩壞：星穹鐵道的確認演出)
const PICK_MS = 300;      // 劇情選項:播完回饋才換畫面
const OPT_PICK_MS = 200;  // 術法、道具抽屜:播完回饋才出手
function pickFx() {
  return [el("span", { class: "pick-fx" }), el("span", { class: "pick-ghost" })];
}
function pick(btn, then, ms = PICK_MS) {
  const group = btn.parentNode;
  if (group.classList.contains("picked")) return;
  group.classList.add("picked");
  btn.classList.add("chosen");
  pickFx().forEach(n => btn.appendChild(n));
  setTimeout(then, ms);
}

function disabledButton(label) {
  return el("button", { class: "choice", disabled: "disabled" }, [el("span", { class: "cl" }, [label])]);
}

function renderAttrs(attrs) {
  const order = ["體質", "根骨", "體魄", "悟性", "氣運", "靈根", "身法"];
  return el("div", { class: "attrs" }, order.map(k =>
    el("div", null, [k, el("span", null, [String(attrs[k])])])
  ));
}

/* ---------- 劇情文字:一句一句打出來,點一下繼續 ----------
   點文字區:正在打字就直接打完這一句;已打完就接下一句。
   全部打完才出現 after(數值等,接在文字下面)和 actions(底部選項框裡的選項,框本身一直都在)。
   右上角有「自動」「略過」,鍵盤可用空白鍵或 Enter。 */

const TYPE_MS = 32;        // 打字速度:每個字幾毫秒
const AUTO_WAIT_MS = 1000; // 「自動」開著時,一句打完停多久再接下一句
const reading = { auto: false };  // 「自動」是玩家的設定,換畫面也保留
const storyProgress = new Map();  // 每段文字已經看到第幾句;打開「查看自身」再回來不會從頭打
let storyScreen = null;           // 目前畫面上的劇情和它的選項框,給點畫面、鍵盤推進用
let lastPhase = null;

// 一句 = 到句號、問號、驚嘆號為止(連同後面的引號)
function splitSentences(line) {
  return line.match(/[^。！？!?]+[。！？!?…]*[」』]*|[。！？!?…]+[」』]*/g) || [line];
}

function storyText(text, after, actions) {
  const sentences = [];
  const body = el("div", { class: "story-body" });
  text.split("\n").forEach(line => {
    const p = el("p", line ? null : { class: "gap" });
    body.appendChild(p);
    if (line) splitSentences(line).forEach(s => sentences.push({ p, text: s }));
  });
  const hint = el("span", { class: "story-hint" }, ["▼"]);
  const autoBtn = el("button", { class: reading.auto ? "on" : "" }, ["自動"]);
  const skipBtn = el("button", null, ["略過"]);
  const tail = el("div", { class: "story-after" }, after);
  tail.hidden = true;
  if (actions) actions.classList.add("waiting");
  const box = el("div", { class: "story" }, [el("div", { class: "story-tools" }, [autoBtn, skipBtn]), body, tail]);

  let shown = Math.min(storyProgress.get(text) || 0, sentences.length);
  let typing = null, waiting = null, span = null;
  const story = {};

  const stopTimers = () => {
    clearInterval(typing);
    clearTimeout(waiting);
    typing = waiting = null;
  };
  const showWhole = i => sentences[i].p.appendChild(el("span", null, [sentences[i].text]));
  const waitForTap = () => {
    sentences[shown - 1].p.appendChild(hint);
    hint.hidden = false;
    if (reading.auto) waiting = setTimeout(typeNext, AUTO_WAIT_MS);
  };
  function done() {
    stopTimers();
    hint.remove();
    tail.hidden = false;
    if (actions) {
      actions.classList.remove("waiting");
      // 只有一個選項時(例如「墜落」)亮一下,讓玩家知道要點它
      const only = actions.querySelectorAll("button.choice:not(:disabled)");
      if (only.length === 1) only[0].classList.add("ready");
    }
    box.classList.add("done");
    story.finished = true;
    if (box.isConnected && tail.firstChild) tail.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function endSentence() {
    stopTimers();
    span.textContent = sentences[shown].text;
    shown += 1;
    storyProgress.set(text, shown);
    if (shown >= sentences.length) done();
    else waitForTap();
  }
  function typeNext() {
    stopTimers();
    if (!box.isConnected || shown >= sentences.length) return; // 畫面已經換掉
    hint.hidden = true;
    span = el("span");
    sentences[shown].p.appendChild(span);
    const full = sentences[shown].text;
    let n = 0;
    typing = setInterval(() => {
      if (!box.isConnected) return stopTimers();
      n += 1;
      span.textContent = full.slice(0, n);
      if (n % 8 === 0) span.scrollIntoView({ block: "nearest", behavior: "smooth" }); // 內容框捲動時跟著新字走
      if (n >= full.length) endSentence();
    }, TYPE_MS);
  }
  story.advance = () => {
    if (typing) endSentence();
    else if (shown < sentences.length) typeNext();
  };
  function skip() {
    if (typing) {
      span.textContent = sentences[shown].text;
      shown += 1;
    }
    stopTimers();
    while (shown < sentences.length) {
      showWhole(shown);
      shown += 1;
    }
    storyProgress.set(text, shown);
    done();
  }

  skipBtn.addEventListener("click", skip);
  autoBtn.addEventListener("click", () => {
    reading.auto = !reading.auto;
    autoBtn.classList.toggle("on", reading.auto);
    if (!reading.auto) {
      clearTimeout(waiting);
      waiting = null;
    } else if (!typing && !waiting && shown < sentences.length) typeNext();
  });

  // 之前看過的句子直接顯示;全部看過就直接出現選項
  storyScreen = { story, actions };
  for (let i = 0; i < shown; i++) showWhole(i);
  if (shown >= sentences.length) done();
  else if (shown > 0) waitForTap();
  else waiting = setTimeout(typeNext, 300);
  return box;
}

// 播劇情時往下走一步:字還沒跑完就跑下一句;跑完了而且只有一個選項(例如「繼續」)就直接進下一段。
// 有兩個以上的選項時要玩家自己選,不動
// 點畫面推進劇情只推進文字(跑字中 → 下一句);文字跑完後選項一定要親手點,
// 這時點空白處只會讓選項閃一下提示,不會替玩家按(避免連點跳過字時多點一下就換了畫面)
function storyStep() {
  if (!storyScreen || storyScreen.story.finished) return false;
  storyScreen.story.advance();
  return true;
}
function nudgeChoices() {
  const a = storyScreen && storyScreen.story.finished && storyScreen.actions;
  if (!a) return;
  a.classList.remove("nudge");
  void a.offsetWidth; // 重新觸發閃一下的動畫
  a.classList.add("nudge");
}

// 點畫面任何地方(按鈕除外)都能推進劇情;掛在 #app 上而不是 document,iPhone 的 Safari 才會送出點擊
document.getElementById("app").addEventListener("click", e => {
  if (e.target.closest("button, a, input, select, textarea")) return;
  if (!storyStep()) nudgeChoices();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.statusOpen) { closeStatus(); return; }
  if (e.key !== " " && e.key !== "Enter") return;
  if (e.target.closest && e.target.closest("input, textarea")) return; // 在輸入框裡打字(例如取名)
  if (e.target.closest && e.target.closest("button")) return; // 焦點在按鈕上時讓按鈕自己處理
  e.preventDefault();
  if (!storyStep()) nudgeChoices();
});

// 畫面 = 上面的內容框 + 貼在底部的選項框(跟戰鬥的四格按鈕同一個位置)
const ORNAMENTS = { bronze: "銅龍外框", dragon: "龍紋浮雕", skull: "骷髏", none: "無" }; // 選項框上的裝飾(測試用,選定後只留一種)

// 引用最上方 defs 裡畫好的圖(龍、石雕、八卦銅盤、銅包角)
function artSvg(cls, id, viewBox, style) {
  const holder = document.createElement("div");
  holder.innerHTML = `<svg class="${cls}" viewBox="${viewBox}"${style ? ` style="${style}"` : ""}><use href="#${id}"/></svg>`;
  return holder.firstChild;
}

function consoleFrame(children) {
  const orn = state.ornament;
  const frame = el("div", { class: "console-frame" }, [el("div", { class: "console-well" }, children)]);
  if (orn === "bronze") {
    // 銅龍外框整個是圖(四角的龍、上下緣都在 CSS 的 border-image 裡),只另外疊上中央銅盤
    return el("div", { class: "console orn-bronze" }, [frame, el("img", { class: "console-crest-img", src: "assets/console-crest.webp", alt: "" })]);
  }
  const parts = [
    frame,
    artSvg("console-cap left", "orn-cap-left", "0 0 40 40"),
    artSvg("console-cap right", "orn-cap-right", "0 0 40 40")
  ];
  if (orn === "skull") {
    parts.push(artSvg("console-orn left", "orn-skull-left", "0 0 100 112"), artSvg("console-orn right", "orn-skull-right", "0 0 100 112"));
  }
  parts.push(artSvg("console-crest", "orn-crest", "0 0 100 100"));
  const box = el("div", { class: "console orn-" + orn }, parts);
  if (orn === "dragon") {
    reliefObserver.disconnect();
    reliefObserver.observe(box);
  }
  return box;
}

// 龍紋浮雕的長度跟著選項框的高度走:框排好版、量到高度才畫,框的大小變了就重畫
const reliefObserver = new ResizeObserver(entries => entries.forEach(e => drawRelief(e.target)));

function drawRelief(box) {
  const frame = box.querySelector(".console-frame");
  const H = frame.offsetHeight;
  const W = parseFloat(getComputedStyle(frame).paddingLeft); // 刻在框左右的邊條上,邊條多寬就刻多寬
  if (!H || frame.dataset.drawn === `${W}/${H}`) return;
  frame.dataset.drawn = `${W}/${H}`;
  frame.querySelectorAll(".console-relief").forEach(n => n.remove());
  frame.prepend(reliefSvg(W, H, false), reliefSvg(W, H, true));
}

// 一側的龍紋(左邊;mirror = 右邊,整個左右翻過來)。單位是畫面上的 px
// 龍頭藏在上緣底下,只露出兩支往後彎的角;龍身蜿蜒往下,中段鑽進一朵祥雲後面,尾巴收在下角
// 填色的深淺就是浮雕的高低:祥雲與背脊最高、角次之、龍身再低一點(鱗片刻成溝)、背鰭最淺
function reliefSvg(W, H, mirror) {
  const k = W / 54;
  const f = n => n.toFixed(1);
  const top = 24, bottom = H - 34 * k; // 上緣讓給回紋,下緣讓給銅包角
  const xc = W * 0.52, A = W * 0.2, T = W * 0.29;

  // 龍身中線:一段段 S 形接起來,每段取 16 個點
  const n = Math.max(3, Math.round((bottom - top) / (62 * k)));
  const d = (bottom - top) / n;
  const spine = [];
  let p = [xc + A * 0.5, top];
  for (let i = 1; i <= n; i++) {
    const q = [i === n ? xc : xc + (i % 2 ? -A : A), top + i * d];
    const c1 = [p[0], p[1] + d * 0.55], c2 = [q[0], q[1] - d * 0.55];
    for (let j = i === 1 ? 0 : 1; j <= 16; j++) {
      const t = j / 16, u = 1 - t;
      spine.push([0, 1].map(m => u * u * u * p[m] + 3 * u * u * t * c1[m] + 3 * u * t * t * c2[m] + t * t * t * q[m]));
    }
    p = q;
  }
  const len = [0];
  for (let i = 1; i < spine.length; i++) len.push(len[i - 1] + Math.hypot(spine[i][0] - spine[i - 1][0], spine[i][1] - spine[i - 1][1]));
  const total = len[len.length - 1];
  const at = u => {
    const i = Math.max(1, Math.min(spine.length - 2, len.findIndex(l => l >= u * total)));
    const a = spine[i - 1], b = spine[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const tan = [(b[0] - a[0]) / l, (b[1] - a[1]) / l];
    return { pt: spine[i], tan, out: [-tan[1], tan[0]] }; // out = 龍背那一側(朝框外)
  };

  // 粗細沿著身體變化的帶狀圖形
  const ribbon = (pts, widths) => {
    const side = sign => pts.map(({ pt, out }, i) => `${f(pt[0] + out[0] * widths[i] / 2 * sign)},${f(pt[1] + out[1] * widths[i] / 2 * sign)}`);
    return `M${side(1).join(" L")} L${side(-1).reverse().join(" L")} Z`;
  };
  // 龍身分兩段露出來,中間鑽進祥雲;沉進去的那一端收細
  const clouds = [0.5];
  const gap = 13 * k / total;
  const runs = [[0, clouds[0] - gap], [clouds[0] + gap, 1]];
  const bodyPaths = [], finPaths = [], ridges = [];
  runs.forEach(([u0, u1], r) => {
    const steps = Math.max(8, Math.round((u1 - u0) * total / 3));
    const pts = [], widths = [];
    for (let i = 0; i <= steps; i++) {
      const u = u0 + (u1 - u0) * i / steps;
      const dist = (r === 0 ? u1 - u : Math.min(u - u0, u1 - u)) * total; // 離沉進去的那一端多遠(第一段從上緣底下出來,上端不收)
      const tuck = Math.min(1, 0.45 + dist / (10 * k));
      const tail = u > 0.85 ? Math.max(0.12, 1 - (u - 0.85) / 0.15) : 1;
      pts.push(at(u));
      widths.push(T * (1 - 0.3 * u) * tuck * tail);
    }
    bodyPaths.push(ribbon(pts, widths));
    // 背脊:沿著龍背外緣一道細細的稜
    ridges.push("M" + pts.map(({ pt, out }, i) => `${f(pt[0] + out[0] * (widths[i] / 2 - 1.6 * k))},${f(pt[1] + out[1] * (widths[i] / 2 - 1.6 * k))}`).join(" L"));
    // 背鰭:沿著龍背,尖端往尾巴那邊斜
    for (let x = (u0 + 6 * k / total); x < u1 - 6 * k / total && x < 0.88; x += 8 * k / total) {
      const { pt, tan, out } = at(x);
      const w = T * (1 - 0.3 * x) / 2 - 1, h = 4.6 * k, half = 2.2 * k;
      const q = (o, t) => `${f(pt[0] + out[0] * o + tan[0] * t)},${f(pt[1] + out[1] * o + tan[1] * t)}`;
      finPaths.push(`M${q(w, -half)} L${q(w + h, half * 1.7)} L${q(w, half)} Z`);
    }
  });

  // 兩支往後彎的角,從上緣底下伸出來
  const horn = (p0, p1, p2, p3, w0) => {
    const pts = [], widths = [];
    for (let i = 0; i <= 14; i++) {
      const t = i / 14, u = 1 - t;
      const pt = [0, 1].map(m => u * u * u * p0[m] + 3 * u * u * t * p1[m] + 3 * u * t * t * p2[m] + t * t * t * p3[m]);
      const dt = [0, 1].map(m => 3 * u * u * (p1[m] - p0[m]) + 6 * u * t * (p2[m] - p1[m]) + 3 * t * t * (p3[m] - p2[m]));
      const l = Math.hypot(dt[0], dt[1]) || 1;
      pts.push({ pt, out: [-dt[1] / l, dt[0] / l] });
      widths.push(w0 * (1 - 0.85 * t));
    }
    return ribbon(pts, widths);
  };
  const horns = [
    horn([xc - 3 * k, top + 7 * k], [xc - 14 * k, top], [4 * k, top + 3 * k], [6 * k, top + 40 * k], 5 * k),
    horn([xc + 4 * k, top + 6 * k], [xc + 13 * k, top], [W - 4 * k, top + 6 * k], [W - 7 * k, top + 28 * k], 4 * k)
  ];

  // 祥雲:兩個往內捲的漩渦,底下一道弧連起來
  const spiral = (cx, cy, R, dir) => {
    const pts = [];
    for (let i = 0; i <= 28; i++) {
      const t = i / 28, a = Math.PI / 2 + dir * t * Math.PI * 2.3, r = R * (1 - 0.78 * t);
      pts.push(`${f(cx + Math.cos(a) * r)},${f(cy + Math.sin(a) * r)}`);
    }
    return "M" + pts.join(" L");
  };
  const cloud = u => {
    const { pt } = at(u), R = 5.6 * k, cx = W * 0.5;
    return spiral(cx - R * 0.95, pt[1] - R * 0.15, R, 1) + " " + spiral(cx + R * 0.95, pt[1] - R * 0.15, R, -1) +
      ` M${f(cx - R * 1.9)},${f(pt[1] + R * 0.6)} Q${f(cx)},${f(pt[1] + R * 1.8)} ${f(cx + R * 1.9)},${f(pt[1] + R * 0.6)}`;
  };

  // 幾道淺淺的刮痕,方向亂一點(固定的亂數,每次重畫都在同樣的位置)
  let seed = mirror ? 7 : 3;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const scratches = [];
  for (let i = 0; i < Math.round(H / 40); i++) {
    const x = W * (0.15 + rnd() * 0.7), y = top + rnd() * (bottom - top);
    const a = (rnd() - 0.5) * 1.6, l = (6 + rnd() * 12) * k;
    scratches.push(`M${f(x)},${f(y)} q${f(Math.cos(a) * l / 2)},${f(Math.sin(a) * l / 2 + 1)} ${f(Math.cos(a) * l)},${f(Math.sin(a) * l)}`);
  }

  const flip = mirror ? ` transform="translate(${f(W)},0) scale(-1,1)"` : "";
  const holder = document.createElement("div");
  holder.innerHTML = `<svg class="console-relief ${mirror ? "right" : "left"}" viewBox="0 0 ${f(W)} ${H}" style="width:${f(W)}px;height:${H}px">` +
    `<g filter="url(#orn-relief)"><rect width="${f(W)}" height="${H}" fill="none"/><g${flip}>` + // 透明的底讓打光範圍蓋滿整條邊條
    `<path fill="#000" fill-opacity=".62" d="${finPaths.join(" ")}"/>` +
    `<g mask="url(#orn-scale-mask-big)"><path fill="#000" fill-opacity=".78" d="${bodyPaths.join(" ")}"/></g>` +
    `<path fill="none" stroke="#000" stroke-width="${f(1.4 * k)}" stroke-linecap="round" d="${ridges.join(" ")}"/>` +
    `<path fill="#000" fill-opacity=".85" d="${horns.join(" ")}"/>` +
    `<path fill="none" stroke="#000" stroke-width="${f(2.3 * k)}" stroke-linecap="round" stroke-linejoin="round" d="${clouds.map(cloud).join(" ")}"/>` +
    `<path fill="none" stroke="#000" stroke-opacity=".3" stroke-width=".6" d="${scratches.join(" ")}"/>` +
    `</g></g></svg>`;
  return holder.firstChild;
}

function dock(buttons) {
  const list = el("div", { class: "choices" }, buttons);
  // 平常不捲動:點選的殘影往外放大時才不會冒出捲軸;選項真的多到放不下(例如測試用的選身份)才打開捲動
  requestAnimationFrame(() => { if (list.scrollHeight > list.clientHeight + 1) list.classList.add("scroll"); });
  return consoleFrame([list]);
}

function screen(children, cls) {
  return el("div", { class: cls ? "screen " + cls : "screen" }, children);
}

function renderTitle() {
  return screen([
    panel([
      el("h1", null, ["逆仙之境 ‧ beta"]),
      player && player.name ? el("div", { class: "meta" }, [`歡迎回來，${player.name}`]) : null,
      player ? el("button", { class: "test-link", onclick: resetPlayer }, ["（測試）清除名字，從頭重玩序章"]) : null
    ]),
    dock([
      choiceButton("新的輪迴", newCycle),
      disabledButton("三生石碑（尚未開放）"),
      disabledButton("天機閣（尚未開放）"),
      disabledButton("道經（尚未開放）")
    ])
  ]);
}

// 文字裡用【】括起來的字標成金色
function richText(text) {
  return text.split(/【(.+?)】/).map((part, i) => i % 2 ? el("b", { class: "b-k" }, [part]) : part);
}

function battleIcon(name) {
  const holder = document.createElement("span");
  holder.innerHTML = BATTLE_ICONS[name];
  return holder.firstChild;
}

// 氣血、靈力:小字標籤 + 大號的「目前/上限」,底下一條細條(參考動作遊戲的敵人名牌);
// kind = "hp" / "mp";沒給 max = 看不透,只寫 cur(例如「？？？」)
function statBlock(kind, track, cur, max) {

function actButton(icon, label, onclick, count, cls) {

    battleIcon(icon), el("span", null, [label]), count ? el("em", null, [count]) : null,
    ...(cls && cls.includes("chosen") ? pickFx() : [])
  ]);
}

// 底部選項框:左邊四個指令,右邊是自己的狀態(mePanel)
function renderBattleActions(animate, mePanel) {
  const P = battleDef();
  const b = state.battle;
  const wait = animate ? " b-wait" : "";
  const itemsLeft = P.items.reduce((n, it) => n + b.items[it.id], 0);
  const openMenu = menu => () => {
    if (Date.now() < b.lockUntil) return; // 演出播完前不打開
    b.menu = menu;
    b.chipOpen = null;
    render();
  };
  const closeMenu = () => {
    if (document.querySelector(".b-sheet.picked")) return; // 已經選了,等它播完
    b.menu = null;
    render();
  };
  // 指令的樣子:剛選的亮一下(chosen)、上次用的留記號(last)、抽屜開著的(open)、
  // 這回合因為情況改變的外框亮起(glow)或變模糊(dim)、剛變成能用的亮一下(lit);
  // 亮光提示(測試用)開著時,正解的指令和抽屜裡那一項也亮起
  const turn = P.turns[b.turn];
  const hint = state.hint === "on" && !b.result && !b.ending;
  const freshIn = list => b.fresh.some(id => list.some(t => t.id === id));
  const cmdCls = id => [
    animate && b.picked === id ? "chosen" : b.last === id ? "last" : "",
    b.menu === id ? "open" : "",
    !b.result && ((turn.glow && turn.glow.includes(id)) || (hint && answerCommand(turn.answer) === id)) ? "glow" : "",
    !b.result && turn.dim && turn.dim.includes(id) ? (animate ? "dim dim-in" : "dim") : "",
    animate && ((id === "spell" && freshIn(P.spells)) || (id === "item" && freshIn(P.items))) ? "lit" : ""
  ].filter(Boolean).join(" ");
  // 分出勝負後指令藏起來(保留位置),只留自己的狀態等黑暗籠罩
  const cmds = el("div", { class: "b-cmds" + wait + (b.result ? " off" : "") }, [
    actButton("attack", "攻擊", () => battleAct("attack"), null, cmdCls("attack")),
    actButton("item", "道具", openMenu("item"), String(itemsLeft), cmdCls("item")),
    actButton("spell", "術法", openMenu("spell"), null, cmdCls("spell")),
    actButton("flee", "逃跑", battleFlee, null, cmdCls("flee"))
  ]);
  const layout = el("div", { class: "b-command" }, [cmds, mePanel]);
  if (b.result || !b.menu) return consoleFrame([layout]);

  const isSpell = b.menu === "spell";
  const list = isSpell ? P.spells : P.items;
  const usable = t => isSpell ? b.mp >= t.cost : b.items[t.id] > 0;
  const costText = t => isSpell ? `靈力 ${t.cost}` : `剩 ${b.items[t.id]}`;
  // 神智不清這類狀態:說明看不清楚,只能憑記憶選
  const blurred = b.statuses.some(s => CONTENT.statusEffectCatalog[s.name].blurDesc);
  const option = t => {
    // 剛變成能用的(例如吃了回元丹,天劍訣的靈力又夠了)外框亮起,只亮這一次
    const attrs = { class: ["b-opt", b.fresh.includes(t.id) ? "lit" : "", hint && t.id === turn.answer ? "glow" : ""].join(" ").trim(), "data-id": t.id };
    if (!usable(t)) attrs.disabled = "disabled";
    const btn = el("button", attrs, [
      el("b", null, [t.name]),
      blurred ? el("span", { class: "blur" }, ["思緒混亂，看不清楚。"]) : el("span", null, [t.desc]),
      el("em", null, [costText(t)])
    ]);
    btn.addEventListener("click", () => pick(btn, () => battleAct(t.id), OPT_PICK_MS));
    return btn;
  };
  const sheetOptions = list.map(option);
  b.fresh = b.fresh.filter(id => !list.some(t => t.id === id));
  const back = el("button", { class: "b-opt", onclick: closeMenu }, [el("span", null, ["返回"])]);

  // 從底部滑上來,指令和狀態留在原地
  return consoleFrame([
    layout,
    el("div", { class: "b-sheet-backdrop", onclick: closeMenu }),
    el("div", { class: "b-sheet" }, [el("h3", null, [isSpell ? "術法" : "道具"]), ...sheetOptions, back])
  ]);
}

// 進場演出(測試用三種,選定後只留一種)。ms = 演出長度,播完前不接受操作
// show = 黑幕散開、舞台露出來的時間(秒),舞台的登場特效從這時開始
const INTRO = {
  "1": { name: "劍光劈開", ms: 1500, show: 0.8 },
  "2": { name: "黑幕印章", ms: 1900, show: 1.2 },
  "3": { name: "霧散名號", ms: 2400, show: 1.3 },
  "4": { name: "迷霧碎裂", ms: 2400, show: 1.3 }
};

// 4 迷霧碎裂:以名號為中心切出蛛網狀碎片(越靠中間越小),每片帶一份名號、一道反光、一圈亮邊
function shatterOverlay() {
  const W = window.innerWidth, H = window.innerHeight;
  const cx = W / 2, cy = H * 0.45;
  const S = 9;                              // 放射狀裂痕幾條
  const base = Math.min(W, H);
  const radii = [base * 0.07, base * 0.2, base * 0.45, Math.hypot(W, H)]; // 由內而外幾圈,最外圈要蓋到四個角
  const angles = Array.from({ length: S }, (_, i) => (i + 0.25 + Math.random() * 0.5) / S * Math.PI * 2);
  // rings[k][i]:第 k 圈、第 i 條裂痕上的點;角度和半徑都抖一下,裂得才不規則
  const rings = radii.map((r, k) => angles.map(a => {
    const rr = k === radii.length - 1 ? r : r * (0.8 + Math.random() * 0.4);
    const aa = a + (Math.random() - 0.5) * 0.12;
    return [cx + Math.cos(aa) * rr, cy + Math.sin(aa) * rr];
  }));
  const pieces = [];
  for (let i = 0; i < S; i++) {
    const j = (i + 1) % S;
    pieces.push([[cx, cy], rings[0][i], rings[0][j]]);
    for (let k = 1; k < rings.length; k++) {
      const q = [rings[k - 1][i], rings[k][i], rings[k][j], rings[k - 1][j]];
      // 外面兩圈的大片,一半機率再斜切成兩片
      if (k >= 2 && Math.random() < 0.5) pieces.push([q[0], q[1], q[2]], [q[0], q[2], q[3]]);
      else pieces.push(q);
    }
  }

  const name = battleDef().enemyName;
  const half = Math.hypot(W, H) / 2;
  const rnd = (min, max) => min + Math.random() * (max - min);
  const pts = poly => poly.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const svg = (cls, inner) => {
    const holder = document.createElement("div");
    holder.innerHTML = `<svg class="${cls}" viewBox="0 0 ${W} ${H}">${inner}</svg>`;
    return holder.firstChild;
  };

  const shards = pieces.map(poly => {
    // 以碎片在畫面內的中心點決定往哪飛:中間的往鏡頭衝、外圈的翻轉掉落
    const vis = poly.map(([x, y]) => [Math.min(Math.max(x, 0), W), Math.min(Math.max(y, 0), H)]);
    // 每片只做成自己在畫面內的外框那麼大:整個螢幕大的碎片一多,iPhone 會記憶體不足而整頁當掉
    const x0 = Math.floor(Math.min(...vis.map(p => p[0]))), y0 = Math.floor(Math.min(...vis.map(p => p[1])));
    const w = Math.ceil(Math.max(...vis.map(p => p[0]))) - x0, h = Math.ceil(Math.max(...vis.map(p => p[1]))) - y0;
    if (w < 1 || h < 1) return null;      // 整片都在畫面外
    const local = poly.map(([x, y]) => [x - x0, y - y0]);
    const mx = vis.reduce((n, p) => n + p[0], 0) / vis.length;
    const my = vis.reduce((n, p) => n + p[1], 0) / vis.length;
    const dist = Math.hypot(mx - cx, my - cy) || 1;
    const t = Math.min(dist / half, 1);   // 0 = 中心,1 = 邊緣
    const ux = (mx - cx) / dist, uy = (my - cy) / dist;
    const push = rnd(60, 180) + (1 - t) * 80;
    const style = [
      `left:${x0}px;top:${y0}px;width:${w}px;height:${h}px`,
      `clip-path:polygon(${local.map(p => `${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(",")})`,
      `transform-origin:${(mx - x0).toFixed(1)}px ${(my - y0).toFixed(1)}px`,
      `--nx:${(ux * rnd(2, 6)).toFixed(1)}px`,
      `--ny:${(uy * rnd(2, 6)).toFixed(1)}px`,
      `--dx:${(ux * push).toFixed(1)}px`,
      `--dy:${(uy * push + rnd(120, 280) * t).toFixed(1)}px`,
      `--dz:${((1 - t) * 260 + rnd(0, 80)).toFixed(1)}px`,
      `--rx:${rnd(-70, 70).toFixed(1)}deg`,
      `--ry:${rnd(-70, 70).toFixed(1)}deg`,
      `--rz:${rnd(-30, 30).toFixed(1)}deg`,
      `--g:${rnd(0, 180).toFixed(0)}deg`,
      `--delay:${(0.85 + t * 0.12).toFixed(2)}s`
    ].join(";");
    // 碎片裡放一張整個畫面大小的底圖(迷霧＋名號),往回位移到碎片所在的位置,超出碎片的部分被裁掉
    const edge = document.createElement("div");
    edge.innerHTML = `<svg class="b-edge" viewBox="0 0 ${w} ${h}"><polygon points="${pts(local)}"/></svg>`;
    return el("div", { class: "b-shard", style }, [
      el("div", { class: "b-shard-in", style: `left:${-x0}px;top:${-y0}px;width:${W}px;height:${H}px` }, [
        el("div", { class: "b-title" }, [el("b", null, [name]), el("i")])
      ]),
      el("div", { class: "b-glint" }),
      edge.firstChild
    ]);
  }).filter(Boolean);

  // 裂痕:每條放射線從中心穿過各圈;每一圈再連成一個環
  const radial = angles.map((_, i) => `<polyline class="rad" pathLength="1" points="${pts([[cx, cy], ...rings.map(r => r[i])])}"/>`);
  const loops = rings.slice(0, -1).map(r => `<polygon class="ring" pathLength="1" points="${pts(r)}"/>`);
  const sparks = Array.from({ length: 18 }, () => {
    const a = rnd(0, Math.PI * 2), d = rnd(80, 300);
    return el("i", {
      class: "b-spark",
      style: `left:${cx}px;top:${cy}px;--px:${(Math.cos(a) * d).toFixed(1)}px;--py:${(Math.sin(a) * d + 60).toFixed(1)}px;` +
        `--s:${rnd(0.5, 1.3).toFixed(2)};animation-delay:${rnd(0.88, 1.15).toFixed(2)}s`
    });
  });

  return el("div", { class: "b-intro v4" }, [
    el("div", { class: "b-intro-fog" }),
    el("div", { class: "b-shard b-base" }, [el("div", { class: "b-title" }, [el("b", null, [name]), el("i")])]),
    ...shards,
    svg("b-cracks", radial.join("") + loops.join("")),
    el("div", { class: "b-impact", style: `left:${cx}px;top:${cy}px` }),
    ...sparks
  ]);
}

function introOverlay(style) {
  if (style === "1") {
    // 劍光沿著斜線劈下,斜線角度要跟黑幕裂開的那條線一致
    const angle = Math.atan2(window.innerHeight * 0.2, window.innerWidth);
    return el("div", { class: "b-intro v1" }, [el("div", { class: "b-intro-line", style: `--a:-${angle}rad` })]);
  }
  if (style === "2") return el("div", { class: "b-intro v2" }, [el("div", { class: "b-seal" }, ["戰"])]);
  if (style === "4") return shatterOverlay();
  return el("div", { class: "b-intro v3" }, [
    el("div", { class: "b-title" }, [el("b", null, [battleDef().enemyName]), el("i")])
  ]);
}

// 測試用:切換進場演出,選定後拿掉
function renderIntroVariants() {
  const replay = style => () => {
    state.introStyle = style;
    state.battle.introPending = true;
    state.battle.menu = null;
    render();
  };
  const box = el("details", state.testsOpen ? { class: "b-tests", open: "" } : { class: "b-tests" }, [
    el("summary", null, ["測試切換（進場、外框、攻擊、特效）"]),
    el("div", { class: "b-variant" }, [
      "進場演出（測試用）：",
      ...Object.keys(INTRO).map(k => el("button", { class: state.introStyle === k ? "on" : "", onclick: replay(k) }, [`${k} ${INTRO[k].name}`])),
      el("button", { onclick: replay(state.introStyle) }, ["重看"])
    ]),
    el("div", { class: "b-variant" }, [
      "選項框外框（測試用）：",
      ...Object.keys(ORNAMENTS).map(k => el("button", {
        class: state.ornament === k ? "on" : "",
        onclick: () => { state.ornament = k; render(); }
      }, [ORNAMENTS[k]]))
    ]),
    el("div", { class: "b-variant" }, [
      "普通攻擊（測試用）：",
      ...[["slash", "斬擊（劍修）"], ["punch", "拳擊（體修）"]].map(([k, name]) => el("button", {
        class: (state.attackStyle || battleDef().attack.fx) === k ? "on" : "",
        onclick: () => { state.attackStyle = k; render(); }
      }, [name]))
    ]),
    el("div", { class: "b-variant" }, [
      "登場特效（測試用，點一下開關）：",
      ...Object.keys(STAGE_FX).map(k => el("button", {
        class: state.stageFx[k] ? "on" : "",
        onclick: () => { state.stageFx[k] = !state.stageFx[k]; render(); }
      }, [STAGE_FX[k]])),
      el("button", { onclick: replay(state.introStyle) }, ["重看"])
    ]),
    testRow("字型（測試用）：", "font", [["wenkai", "霞鶩文楷"], ["serif", "思源宋體"], ["old", "舊版（新細明體）"]]),
    testRow("介面（測試用）：", "uiStyle", [["new", "新版（照設計圖）"], ["old", "舊版"]]),
    testRow("條的樣子（新版介面）：", "barStyle", [["hex", "六角刀形"], ["plain", "純細框"]]),
    testRow("亮光提示（測試用）：", "hint", [["on", "開"], ["off", "關"]]),
    testRow("前世殘念（測試用）：", "soulEcho", [["record", "照紀錄"], ["force", "每回合都出現"], ["off", "關"]], () => { state.battle.echoTurn = -1; })
  ]);
  box.addEventListener("toggle", () => { state.testsOpen = box.open; });
  return box;
}

// 測試切換的一排:點了把 state[key] 換成那個值;then = 換完、重畫前要做的事
function testRow(label, key, options, then) {
  return el("div", { class: "b-variant" }, [
    label,
    ...options.map(([value, name]) => el("button", {
      class: state[key] === value ? "on" : "",
      onclick: () => { state[key] = value; if (then) then(); render(); }
    }, [name]))
  ]);
}

// Boss 的徽記(新版介面的名號牌、說話標籤上):每個 Boss 一個,content.js 的 emblem 指定;暫代向量圖,之後可換成美術出的圖
const EMBLEMS = {
  plum: (() => {
    const pt = (r, deg) => [20 + r * Math.cos(deg * Math.PI / 180), 20 + r * Math.sin(deg * Math.PI / 180)].map(v => v.toFixed(2));
    const petals = [0, 1, 2, 3, 4].map(k => { const [x, y] = pt(9, k * 72 - 90); return `<circle cx="${x}" cy="${y}" r="7.6"/>`; }).join("");
    const stamens = [0, 1, 2, 3, 4].map(k => { const [x, y] = pt(6.6, k * 72 - 54); return `<circle cx="${x}" cy="${y}" r="1.2"/>`; }).join("");
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><radialGradient id="p" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff2d2"/><stop offset=".55" stop-color="#e9c173"/><stop offset="1" stop-color="#9a6a28"/></radialGradient></defs>`
      + `<g fill="url(#p)" stroke="#4a2f10" stroke-width=".9">${petals}</g><circle cx="20" cy="20" r="4.4" fill="#b8322a" stroke="#4a1410" stroke-width=".7"/><g fill="#fff2d2">${stamens}</g></svg>`;
  })()
};

// ---- 玩家:名字 + 一組隱藏的 ID,存在本機(這台裝置的這個瀏覽器)----
// 名字只是顯示用,兩個玩家可以取一樣的名字;id 才是真正的玩家編號,之後做雲端存檔時拿它綁帳號。
// childhoodDone = 桃花村玩過了(只有第一次進遊戲會玩);prologueDone = 序章戰鬥打過了(也只打一次)
const PLAYER_KEY = "nixian.player";
let player = (() => {
  try { return JSON.parse(localStorage.getItem(PLAYER_KEY)); } catch (e) { return null; }
})();
function savePlayer() {
  try { localStorage.setItem(PLAYER_KEY, JSON.stringify(player)); } catch (e) { /* 無痕模式之類存不了,這次遊戲裡還是記得 */ }
}
function resetPlayer() {
  try { localStorage.removeItem(PLAYER_KEY); } catch (e) { /* 同上 */ }
  player = null;
  render();
}
function newPlayerId() {
  try { return crypto.randomUUID(); } catch (e) { return "p-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
}
function playerName() {
  return (player && player.name) || "你";
}
// 台詞裡的 {name};還沒取名(例如測試時用 ?skipchild 直接開打)就叫「喂」
function fillName(text) {
  return text ? text.replace(/\{name\}/g, (player && player.name) || "喂") : text;
}

// 新的輪迴:第一次進遊戲先玩桃花村,接著打序章戰鬥(只打一次);之後的輪迴直接從選身份開始
// (測試用:網址加 ?skipchild 或 #skipchild,每次都直接開打序章)
const SKIP_CHILD = /skipchild/.test(location.search + location.hash);
function newCycle() {
  if (SKIP_CHILD) startPrologue();
  else if (!(player && player.childhoodDone)) startChildhood();
  else if (!player.prologueDone) startPrologue();
  else { state.phase = "select"; render(); }
}

// ---- 序章前段:桃花村(資料在 content.js 的 childhood)----
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function startChildhood() {
  const C = CONTENT.childhood;
  // 已經取過名字(例如上次玩到一半)就不再問
  state.childNode = player && player.name ? C.nodes[C.start].next : C.start;
  // 從頭開始(還沒取名)才播開場;系統開了「減少動態效果」就不播
  state.awaken = state.childNode === C.start && C.opening && !REDUCE_MOTION ? "intro" : null;
  state.phase = "child";
  render();
}

// 第一次進遊戲的開場(全螢幕,content.js 的 childhood.opening):主角在做惡夢,眨了幾次眼才醒過來。
// 夢裡:白煙、模糊的金色人影(醉花仙的圖)、飄落的金色花瓣、一句問話;火光和字幕「……閉上眼睛。」;
// 金光亮起、夢散了;黑暗裡有人叫你醒醒;最後睜眼看到的是第一段的圖(雪梅花),從模糊對焦。可以略過
const AWAKEN_MS = 12000;    // 跟 CSS 的 .awaken 動畫長度一樣
const AWAKEN_OUT_MS = 1200; // 播完後全螢幕的圖淡掉要多久
// 花瓣的位置每次都一樣(固定亂數種子)
const AW_PETALS = (() => {
  let s = 11;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 12 }, () => ({ x: rnd() * 100, size: 6 + rnd() * 7, dur: 5 + rnd() * 4, delay: rnd() * 6, dx: (rnd() - 0.5) * 120 }));
})();
function awakenIntro() {
  const finish = () => {
    if (state.phase !== "child" || state.awaken !== "intro") return; // 已經略過了
    state.awaken = "out";
    render();
  };
  setTimeout(finish, AWAKEN_MS);
  const skip = el("button", { class: "awaken-skip" }, ["略過"]);
  skip.addEventListener("click", finish);
  const C = CONTENT.childhood;
  const O = C.opening;
  const sub = (cls, line) => el("div", { class: `aw-sub ${cls}` }, [el("b", null, [O.speaker]), line]);
  return el("div", { class: "awaken" }, [
    el("i", { class: "aw-dream", style: `background-image:url("${O.dreamArt}")` }),
    el("i", { class: "awaken-smoke" }),
    el("i", { class: "aw-fire" }),
    el("i", { class: "aw-petals" }, AW_PETALS.map(p => el("b", {
      style: `--x:${p.x.toFixed(1)}%;--s:${p.size.toFixed(1)}px;--d:${p.dur.toFixed(1)}s;--delay:${p.delay.toFixed(1)}s;--dx:${p.dx.toFixed(0)}px`
    }))),
    el("div", { class: "awaken-q" }, [...O.question].map((ch, i) => el("span", { style: `--i:${i}` }, [ch]))),
    el("i", { class: "awaken-gold" }),
    el("i", { class: "aw-wake" }, [sceneStage(C.nodes[C.start])]),
    el("i", { class: "aw-vignette" }),
    el("i", { class: "awaken-lid top" }),
    el("i", { class: "awaken-lid bottom" }),
    sub("s1", O.dreamLine),
    sub("s2", O.wakeLine),
    skip
  ]);
}

// 選項的 to:節點名稱、"battle:childBattle" 開打教學戰、"prologue" 進序章戰鬥(桃花村算玩過了)
function goChild(to) {
  if (to.startsWith("battle:")) { startPrologue(CONTENT[to.slice(7)]); return; }
  if (to === "prologue") {
    if (player) { player.childhoodDone = true; savePlayer(); }
    startPrologue();
    return;
  }
  state.childNode = to;
  render();
}

// 段落的圖(content.js 的 art、artSize、artPos):用一個跟圖同比例的舞台鋪滿畫面(跟 background-size: cover 一樣),
// 有 wave 的話再疊一層會動的手,位置和手腕(擺動的軸)都用圖上的百分比
function sceneStage(node) {
  const [w, h] = node.artSize;
  const [px, py] = node.artPos || [50, 50];
  const wv = node.wave;
  return el("div", { class: "scene-stage", style: `--ar:${(w / h).toFixed(4)};--ari:${(h / w).toFixed(4)};--px:${px};--py:${py}` }, [
    el("img", { class: "scene-base", src: node.art, alt: "" }),
    wv ? el("img", { class: "scene-wave", src: wv.src, alt: "", style: `left:${wv.box[0]}%;top:${wv.box[1]}%;width:${wv.box[2]}%;transform-origin:${wv.pivot[0]}% ${wv.pivot[1]}%` }) : null
  ]);
}

// 窗外飄進來的花瓣(content.js 的 petals: true);位置每次都一樣(固定亂數種子),一開始就在半空中
const SCENE_PETALS = (() => {
  let s = 5;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 8 }, () => ({ x: 30 + rnd() * 75, size: 7 + rnd() * 6, dur: 6 + rnd() * 5, delay: rnd() * 10, dx: -(60 + rnd() * 140) }));
})();
function scenePetals() {
  return el("i", { class: "scene-petals" }, SCENE_PETALS.map(p => el("b", {
    style: `--x:${p.x.toFixed(1)}%;--s:${p.size.toFixed(1)}px;--d:${p.dur.toFixed(1)}s;--delay:-${p.delay.toFixed(1)}s;--dx:${p.dx.toFixed(0)}px`
  })));
}

function submitName(input, hint, next) {
  const name = input.value.trim();
  if (!name) {
    hint.textContent = "先取個名字吧。";
    input.focus();
    return;
  }
  player = { id: (player && player.id) || newPlayerId(), name, childhoodDone: false, createdAt: (player && player.createdAt) || Date.now() };
  savePlayer();
  goChild(next);
}

function renderChild() {
  if (state.awaken === "intro") return awakenIntro();
  const node = CONTENT.childhood.nodes[state.childNode];
  let actions;
  if (node.input === "name") {
    // 取名:選項框裡放一個輸入框和「就叫這個」;按 Enter 也可以
    const input = el("input", { class: "name-input", type: "text", maxlength: "8", placeholder: "例如：阿青", autocomplete: "off", enterkeyhint: "done", "aria-label": "你的名字" });
    if (player && player.name) input.value = player.name;
    const hint = el("span", { class: "name-hint" });
    const ok = el("button", { class: "choice name-ok" }, [el("span", { class: "cl" }, ["就叫這個"])]);
    ok.addEventListener("click", () => submitName(input, hint, node.next));
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); submitName(input, hint, node.next); }
    });
    actions = consoleFrame([el("div", { class: "choices name-entry" }, [el("div", { class: "name-row" }, [input, ok]), hint])]);
  } else {
    actions = dock(node.choices.map(c => choiceButton(fillName(c.label), () => goChild(c.to))));
  }
  const body = [node.title ? el("h1", null, [node.title]) : null, storyText(fillName(node.text), [], actions)];
  // 有圖的段落:圖鋪滿上方,文字壓在圖的下緣(跟戰鬥畫面一樣)
  const top = node.art
    ? el("div", { class: "child-scene" }, [sceneStage(node), node.petals ? scenePetals() : null, el("div", { class: "scene-text" }, body)])
    : panel(body);
  // 開場剛播完:全螢幕的雪梅花蓋在上面慢慢淡掉,淡完就拿掉
  let unveil = null;
  if (state.awaken === "out") {
    state.awaken = null;
    unveil = el("div", { class: "awaken out" }, [el("i", { class: "aw-wake" }, [sceneStage(node)])]);
    setTimeout(() => unveil.remove(), AWAKEN_OUT_MS);
  }
  return screen([top, actions, unveil], unveil ? null : "fade-in");
}

// 夥伴卡:圖區左下角,頭像外圈是集氣環,寫著再幾回合出手;集滿的那回合整張卡亮起
function allyCard(b, A) {
  const left = A.every - b.ally.charge; // 包含這回合在內,再幾個回合結束時出手
  const pct = Math.round((b.ally.charge / A.every) * 100);
  return el("div", { class: left <= 1 ? "b-ally ready" : "b-ally", "aria-label": `夥伴 ${A.name}，${left <= 1 ? "這回合結束時出手" : `再 ${left} 回合出手`}` }, [
    el("div", { class: "b-ally-ring", style: `--p:${left <= 1 ? 100 : pct}%` }, [el("i", { class: "b-ally-face", style: `background-image:url("${A.portrait}")` })]),
    el("div", { class: "b-ally-info" }, [
      el("b", null, [A.name]),
      el("span", null, [left <= 1 ? "本回合出手" : `再 ${left} 回合出手`])
    ])
  ]);
}

// 夥伴出手的特寫:一條斜斜的橫幅帶著頭像和招式名劃過舞台;播完就拿掉
function allyCutIn(A, skillName) {
  const node = el("div", { class: "ally-cut" }, [
    el("div", { class: "ally-cut-band" }, [
      el("i", { class: "ally-cut-face", style: `background-image:url("${A.portrait}")` }),
      el("div", { class: "ally-cut-text" }, [el("small", null, [`夥伴・${A.name}`]), el("b", null, [skillName])])
    ])
  ]);
  setTimeout(() => node.remove(), ALLY_CUT_MS);
  return node;
}

// ---- 前世殘念:魂群(測試切換「前世殘念」)----
// 序章打輸時記下這一輪選錯的回合(一輪輪累積,打贏才清掉);下一輪到了那些回合,一群魂火像魚群一樣游過來,
// 繞著正確的選項打轉幾秒再散去,像前世的你還記得。少用:只在前世選錯的回合出現,每回合一次。
// (反過來把你帶去錯的選項的「浮夢誘導」,留到最終結局當伏筆,中間不用)
const ECHO_KEY = "nixian.soulEcho";
function loadEcho() {
  try { return JSON.parse(localStorage.getItem(ECHO_KEY)) || []; } catch (e) { return []; }
}
function saveEcho(turns) {
  try { localStorage.setItem(ECHO_KEY, JSON.stringify(turns)); } catch (e) { /* 無痕模式之類存不了,就不記 */ }
}

// 這回合的正解在哪個按鈕:抽屜開著就指抽屜裡那一項,不然指攻擊、術法或道具
function echoTarget() {
  const P = battleDef();
  const b = state.battle;
  const ans = P.turns[b.turn].answer;
  const opt = document.querySelector(`.b-sheet .b-opt[data-id="${ans}"]`);
  if (opt) return opt;
  return document.querySelector(`.b-act[data-cmd="${answerCommand(ans)}"]`);
}

// 正解在哪個指令底下:攻擊、術法或道具
function answerCommand(ans) {
  if (ans === "attack") return "attack";
  return battleDef().spells.some(s => s.id === ans) ? "spell" : "item";
}

// 每次畫完戰鬥畫面後檢查:這回合該不該出現、是不是已經出現過
function syncSoulEcho(delay) {
  const b = state.battle;
  if (state.phase !== "prologue" || !b) return;
  const on = state.soulEcho === "force" || (state.soulEcho === "record" && b.echo.includes(b.turn));
  if (!on || b.result || b.ending) { soulSwarm.stop(); return; }
  if (b.echoTurn === b.turn) return;
  b.echoTurn = b.turn;
  soulSwarm.start(echoTarget, delay);
}

// 魂群:一層蓋滿畫面的畫布(點不到),播完就拿掉;系統開了「減少動態效果」就不播
const soulSwarm = (() => {
  const N = 12, LIFE = 6500;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let canvas = null, ctx = null, raf = 0, agents = [], target = null, from = 0, until = 0;
  function start(getTarget, delay) {
    if (reduce) return;
    target = getTarget;
    from = performance.now() + delay;
    until = from + LIFE;
    // 從畫面左邊或右邊、偏下的地方成群游進來
    const left = Math.random() < 0.5;
    const x0 = left ? -30 : innerWidth + 30, y0 = innerHeight * (0.5 + Math.random() * 0.3);
    agents = Array.from({ length: N }, (_, i) => ({
      x: x0 + (Math.random() - 0.5) * 70, y: y0 + (Math.random() - 0.5) * 70,
      vx: (left ? 1 : -1) * (2 + Math.random() * 2), vy: -1 - Math.random(),
      phase: (i / N) * Math.PI * 2, speed: 0.8 + Math.random() * 0.5, size: 1.6 + Math.random() * 1.4, trail: []
    }));
    if (!canvas) {
      canvas = el("canvas", { class: "soul-echo", "aria-hidden": "true" });
      document.body.appendChild(canvas);
      ctx = canvas.getContext("2d");
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function stop() {
    if (raf) until = Math.min(until, performance.now() + 500);
  }
  function tick(now) {
    if (now >= until) {
      raf = 0;
      canvas.remove();
      canvas = ctx = null;
      return;
    }
    raf = requestAnimationFrame(tick);
    const w = canvas.clientWidth, h = canvas.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr)) canvas.width = Math.round(w * dpr);
    if (canvas.height !== Math.round(h * dpr)) canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (now < from) return;
    const t = now - from;
    const node = target();
    const r = node && node.getBoundingClientRect();
    const cx = r ? r.left + r.width / 2 : w / 2, cy = r ? r.top + r.height / 2 : h / 2;
    const rx = r ? r.width / 2 + 8 : 40, ry = r ? r.height / 2 + 6 : 20;
    const fade = Math.min(1, t / 600, (until - now) / 900);
    const leaving = until - now < 1100;
    ctx.globalCompositeOperation = "lighter";
    agents.forEach(a => {
      // 先成群游向目標,到了就繞著它打轉;最後一秒散開往上飄
      a.phase += 0.025 * a.speed;
      const gx = leaving ? a.x + Math.cos(a.phase) * 30 : cx + Math.cos(a.phase) * rx;
      const gy = leaving ? a.y - 80 : cy + Math.sin(a.phase) * ry;
      // 游過去時慢慢靠近;到了之後拉緊(接近臨界阻尼),才會穩穩繞著那一顆按鈕,不會甩得到處都是
      const [k, damp] = t < 1400 ? [0.0025, 0.93] : [0.0056, 0.85];
      a.vx = (a.vx + (gx - a.x) * k + (Math.random() - 0.5) * 0.3) * damp;
      a.vy = (a.vy + (gy - a.y) * k + (Math.random() - 0.5) * 0.3) * damp;
      a.x += a.vx;
      a.y += a.vy;
      a.trail.push([a.x, a.y]);
      if (a.trail.length > 10) a.trail.shift();
      for (let j = 1; j < a.trail.length; j++) {
        ctx.strokeStyle = `rgba(190,225,255,${(j / a.trail.length) * 0.35 * fade})`;
        ctx.lineWidth = a.size * j / a.trail.length;
        ctx.beginPath();
        ctx.moveTo(a.trail[j - 1][0], a.trail[j - 1][1]);
        ctx.lineTo(a.trail[j][0], a.trail[j][1]);
        ctx.stroke();
      }
      const glow = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.size * 4);
      glow.addColorStop(0, `rgba(235,248,255,${0.95 * fade})`);
      glow.addColorStop(0.35, `rgba(150,205,255,${0.45 * fade})`);
      glow.addColorStop(1, "rgba(120,180,255,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.size * 4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = "source-over";
  }
  return { start, stop };
})();

// ---- 舞台的登場特效(測試切換可以一項一項開關)----
// 鏡頭推近 = 登場時圖從放大退回原位(只有開頭一次);飄浮光塵 = 金色光點往上飄(真身改成血色灰燼往下落);
// 邊緣光暈 = 舞台四周泛金光(真身改成滲紅、像心跳);預告配畫面 = 每回合的預告出現時舞台跟著變一次(content.js 的 scene);
// 符文陣 = 登場時符文圓陣在畫面前方展開再消失(暫代向量圖,之後換成 AI 出的黑底圖)
const STAGE_FX = { push: "鏡頭推近", dust: "飄浮光塵", edge: "邊緣光暈", scene: "預告配畫面", rune: "符文陣" };
const FX_T0 = performance.now();
// 一直循環的動畫照同一個時鐘走:畫面重畫(出手、開選單)時接著播,不會從頭跳
function loopDelay(sec, offset = 0) {
  return `${-(((performance.now() - FX_T0) / 1000 + offset) % sec).toFixed(2)}s`;
}

// 光塵的位置每次都一樣(固定亂數種子),重畫時才接得上
const DUST = (() => {
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 14 }, () => ({ x: rnd() * 100, size: 2 + rnd() * 2.5, dur: 6 + rnd() * 5, dx: (rnd() - 0.5) * 40, off: rnd() * 11 }));
})();
function dustLayer(ash) {
  return el("div", { class: ash ? "b-dust ash" : "b-dust" }, DUST.map(p => el("i", {
    style: `left:${p.x.toFixed(1)}%;--s:${p.size.toFixed(1)}px;--dx:${p.dx.toFixed(0)}px;animation-duration:${p.dur.toFixed(1)}s;animation-delay:${loopDelay(p.dur, p.off)}`
  })));
}

// 符文陣(暫代):外圈刻度、八個卦象、內圈八角星;線畫兩層,底下粗的暗線讓亮底上也看得清楚
const RUNE_SVG = (() => {
  const pt = (r, deg) => [50 + r * Math.cos(deg * Math.PI / 180), 50 + r * Math.sin(deg * Math.PI / 180)].map(v => v.toFixed(2));
  const parts = [48.5, 43, 30, 26.5].map(r => `<circle cx="50" cy="50" r="${r}"/>`);
  for (let i = 0; i < 48; i++) {
    const [x1, y1] = pt(i % 4 ? 45.5 : 43, i * 7.5), [x2, y2] = pt(47.5, i * 7.5);
    parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
  }
  for (let k = 0; k < 8; k++) {
    const bars = [0, 1, 2].map(j => {
      const y = 17 - j * 3.4; // 離圓心 33~40,落在內圈(30)和外圈(43)之間
      return (k >> j) & 1
        ? `<line x1="44" y1="${y}" x2="48.6" y2="${y}"/><line x1="51.4" y1="${y}" x2="56" y2="${y}"/>`
        : `<line x1="44" y1="${y}" x2="56" y2="${y}"/>`;
    });
    parts.push(`<g transform="rotate(${k * 45} 50 50)">${bars.join("")}</g>`);
  }
  parts.push(`<polygon points="${Array.from({ length: 8 }, (_, i) => pt(25, i * 135 - 90).join(",")).join(" ")}"/>`);
  const body = parts.join("");
  return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round"><g class="dark" stroke-width="1.8" opacity=".55">${body}</g><g stroke-width=".8">${body}</g></svg>`;
})();
function runeLayer(blood, delay) {
  const node = el("div", { class: blood ? "b-rune blood" : "b-rune", style: `animation-delay:${delay}s` });
  node.innerHTML = RUNE_SVG;
  setTimeout(() => node.remove(), (delay + 1.8) * 1000); // 播完就拿掉
  return node;
}

// 預告配畫面:copies = 疊在圖上、跟著圖動的分身(放進 .b-scn),overlays = 蓋在舞台上的光影。
// 只在預告剛出現時(fresh)播一次:ghost、pulse、murmur 播完就消失;press、dream、fade、focus 停在那個樣子到下一回合
function sceneLayers(scene, art, fresh) {
  const copy = cls => el("div", { class: `b-art ${cls}`, style: `background-image:url("${art}")` });
  const shade = cls => el("i", { class: `b-shade ${cls}` });
  const none = { copies: [], overlays: [] };
  if (scene === "ghost") return fresh ? { copies: [copy("ghost l"), copy("ghost r")], overlays: [] } : none;
  if (scene === "press") return { copies: [], overlays: [shade("press")] };
  if (scene === "pulse") return fresh ? { copies: [], overlays: [shade("pulse")] } : none;
  if (scene === "murmur") return fresh ? { copies: [copy("haze")], overlays: [0, 1, 2].map(i => el("i", { class: "b-ring", style: `--i:${i}` })) } : none;
  if (scene === "dream") return { copies: [copy("dream")], overlays: [shade("dream")] };
  if (scene === "fade") return { copies: [copy("gray")], overlays: [] };
  if (scene === "focus") return { copies: [], overlays: [shade("focus"), el("i", { class: "b-point" })] };
  return none;
}

// 攻擊演出的特效層:斬擊(劍修)= 刀光沿弧線一閃、留下刀痕、火花往刀痕兩側噴;
// 拳擊(體修)= 白光、衝擊星芒、衝擊波環、放射速度線、揚塵。落空時只有刀光或拳風
const SLASH_PATH = [[90, 8], [74, 72], [8, 90]]; // 斜劈的弧線(二次貝茲曲線,特效框 100×100 座標)
function attackFx(atk) {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const svg = markup => {
    const holder = document.createElement("div");
    holder.innerHTML = markup;
    return holder.firstChild;
  };
  const kids = [];
  if (atk.style === "punch") {
    if (atk.hit) {
      kids.push(el("i", { class: "flash" }));
      const star = Array.from({ length: 24 }, (_, i) => {
        const r = i % 2 ? 20 : 48, a = i / 24 * Math.PI * 2;
        return `${(50 + Math.cos(a) * r).toFixed(1)},${(50 + Math.sin(a) * r).toFixed(1)}`;
      }).join(" ");
      kids.push(svg(`<svg class="star" viewBox="0 0 100 100"><polygon points="${star}"/></svg>`));
      for (let i = 0; i < 6; i++) kids.push(el("i", { class: "dust", style: `--dx:${rnd(-70, 70).toFixed(0)}px;--dy:${rnd(-6, 36).toFixed(0)}px` }));
    }
    kids.push(el("i", { class: "ring" }));
    for (let i = 0; i < 10; i++) kids.push(el("i", { class: "line", style: `--a:${(i * 36 + rnd(-8, 8)).toFixed(0)}deg` }));
  } else {
    const [p0, p1, p2] = SLASH_PATH;
    const d = `M ${p0} Q ${p1} ${p2}`;
    const paths = ["glow", "edge", "core"].map(c => `<path class="trail ${c}" pathLength="1" d="${d}"/>`).join("");
    kids.push(svg(`<svg class="arc" viewBox="0 0 100 100">${paths}${atk.hit ? `<path class="scar" pathLength="1" d="${d}"/>` : ""}</svg>`));
    // 火花:散在刀痕中段,往刀痕兩側噴;角度、長短、出現時間都錯開,才不會排成一串
    if (atk.hit) for (let i = 0; i < 8; i++) {
      const t = rnd(0.28, 0.72), u = 1 - t;
      const x = u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], y = u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1];
      kids.push(el("i", { class: "spark", style: `--x:${x.toFixed(1)}%;--y:${y.toFixed(1)}%;--r:${((i % 2 ? 45 : 225) + rnd(-55, 55)).toFixed(0)}deg;` +
        `--d:${rnd(16, 46).toFixed(0)}px;--w:${rnd(5, 14).toFixed(0)}px;animation-delay:${rnd(0.19, 0.27).toFixed(2)}s` }));
    }
  }
  return el("div", { class: `b-fx ${atk.style}` }, kids);
}

// 條從上一刻的數值滑到現在的數值
function drainStyle(from, to, max) {
  const pct = v => Math.max(0, v) / max * 100;
  return `--from:${pct(from)}%;--to:${pct(to)}%`;
}

function renderPrologue() {
  const P = battleDef();
  const b = state.battle;
  // 效果只在出手後那一次畫面播放;打開選單、查看自身再回來都不重播
  const fx = b.fx;
  const animate = !!fx;
  const from = { hp: b.prevHp, mp: b.prevMp };
  b.fx = null;
  b.prevHp = b.hp;
  b.prevMp = b.mp;
  // 進場演出只在開打那一次(或按「重看」)播放
  const intro = b.introPending ? state.introStyle : null;
  const introNode = intro ? introOverlay(intro) : null;
  if (intro) {
    b.introPending = false;
    b.lockUntil = Date.now() + INTRO[intro].ms;
    // 播完就拿掉:留在畫面上的碎片會一直佔著顯示記憶體
    setTimeout(() => introNode.remove(), INTRO[intro].ms + 200);
  }

  const start = Math.max(0, b.log.length - LOG_LINES);
  let delay = 0;
  const lines = b.log.slice(start).map((line, i) => {
    const fresh = animate && start + i >= b.freshFrom;
    const cls = [line.who || "result", start + i < b.freshFrom ? "old" : "", fresh ? "fresh" : ""].join(" ").trim();
    const attrs = { class: cls };
    if (fresh) {
      attrs.style = `animation-delay:${delay}s`;
      delay += 0.25;
    }
    return logLine(line, attrs);
  });
  const openBacklog = () => {
    if (Date.now() < b.lockUntil) return; // 演出播完前不打開
    b.backlog = true;
    b.menu = null;
    render();
  };

  const hpTrack = el("div", { class: fx && fx.shield ? "b-track b-shield" : "b-track" }, [
    el("div", { class: "b-ghost", style: drainStyle(from.hp, b.hp, P.hp) }),
    el("div", { class: "b-fill hp", style: drainStyle(from.hp, b.hp, P.hp) })
  ]);
  const mpTrack = el("div", { class: "b-track" }, [
    el("div", { class: "b-fill mp", style: drainStyle(from.mp, b.mp, P.mpMax) })
  ]);
  let meFloat = null;
  if (fx && fx.hurt) meFloat = el("span", { class: "b-float" }, [el("small", null, ["氣血"]), `−${fx.hurt}`]);
  else if (fx && fx.block) meFloat = el("span", { class: "b-float silver" }, ["格擋"]);
  // 夥伴補的血、靈力:在自己的狀態欄跳綠色/藍色的字,排在出手特寫之後
  const allyFloat = fx && (fx.allyHeal || fx.allyMp)
    ? el("span", { class: fx.allyHeal ? "b-float heal" : "b-float mana", style: "animation-delay:2s" }, [el("small", null, [fx.allyHeal ? "氣血" : "靈力"]), `+${fx.allyHeal || fx.allyMp}`])
    : null;
  // 狀態發作的跳字排在受擊之後,用狀態自己的顏色
  const dotColor = fx && fx.dot && CONTENT.statusEffectCatalog[fx.dot.name].color;
  const dotFloat = fx && fx.dot
    ? el("span", { class: "b-float dot", style: `--c:${dotColor};animation-delay:${fx.hurt ? 1.1 : 0.6}s` }, [el("small", null, [fx.dot.name]), `−${fx.dot.amount}`])
    : null;
  const atk = fx && fx.attack;
  const fxNode = atk ? attackFx(atk) : null;
  if (fxNode) setTimeout(() => fxNode.remove(), 1200); // 播完就拿掉,免得一直佔著圖層
  const split = atk && atk.hit && atk.style === "slash"; // 斬中時目標沿刀痕錯開(只有光團這樣演,有圖時整張圖閃一下)
  // 敵人:有圖就放整張圖(角色連背景),沒有就用光團頂著;真身露出的那一刻,金身的兩半疊在上面滑開
  const artDiv = (src, cls) => el("div", { class: cls ? `b-art ${cls}` : "b-art", style: `background-image:url("${src}")` });
  let enemy;
  if (!P.art) enemy = [el("div", { class: split ? "b-enemy-art split" : "b-enemy-art" }, split ? [el("i", { class: "half a" }), el("i", { class: "half b" })] : [])];
  else if (b.trueForm) enemy = fx && fx.reveal
    ? [artDiv(P.trueArt, "fill"), artDiv(P.trueArt, "main"), artDiv(P.art, "shed a"), artDiv(P.art, "shed b"), el("i", { class: "b-reveal-flash" })]
    : [artDiv(P.trueArt, "fill"), artDiv(P.trueArt, "main")];
  else enemy = [artDiv(P.art, "fill"), artDiv(P.art, "main")];
  // 舞台特效(測試切換可以一項一項關掉);沒有敵人圖時都不播
  const sfx = P.art ? { ...state.stageFx, ...(P.stageFx || {}) } : {}; // 這場關掉的特效(content.js 的 stageFx)
  const scene = sfx.scene && !b.trueForm ? P.turns[b.turn].scene : null;
  const sceneFresh = scene && b.sceneTurn !== b.turn; // 這回合的預告剛出現:光影從無到有
  b.sceneTurn = b.turn;
  const layers = sceneLayers(scene, P.art, sceneFresh);
  const enterAt = intro ? INTRO[intro].show : 0;
  const cam = el("div", { class: sfx.push && intro ? "b-cam push" : "b-cam" }, [

  const dust = sfx.dust ? dustLayer(b.trueForm) : null;

  const rune = sfx.rune && (intro || (fx && fx.reveal)) ? runeLayer(!intro, intro ? enterAt : 0.15) : null;
  const stageCls = ["b-frame b-stage", atk ? `b-atk-${atk.style} ${atk.hit ? "b-atk-hit" : "b-atk-miss"}` : "", fx && fx.reveal ? "b-reveal" : "",
    scene ? `scene-${scene}` : "", sceneFresh ? "sc-in" : ""].join(" ").trim();
  const stageStyle = `--enter:${enterAt}s;--sd:${intro ? enterAt + 0.2 : 0.6}s`; // --sd = 預告光影開始出現的時間

  // 名字底下一排狀態標籤,點了看說明;這一排一直佔著位置,狀態來去時名字不會跳
  const toggleChip = name => () => {
    if (b.result || b.ending) return;
