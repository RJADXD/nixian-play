  };
  const chips = b.statuses.map(s => {
    const def = CONTENT.statusEffectCatalog[s.name];
    const cls = ["b-chip", fx && fx.gained === s.name ? "new" : "", b.chipOpen === s.name ? "on" : ""].join(" ").trim();
    return el("button", { class: cls, style: `--c:${def.color}`, onclick: toggleChip(s.name), "aria-label": `${s.name}，還剩 ${s.left} 回合` }, [
      def.mark, el("em", null, [String(s.left)])
    ]);
  });
  const open = b.statuses.find(s => s.name === b.chipOpen);
  const tip = open ? el("div", { class: "b-tip", style: `--c:${CONTENT.statusEffectCatalog[open.name].color}` }, [
    el("b", null, [open.name]), el("span", null, [`還剩 ${open.left} 回合`]),
    el("p", null, [CONTENT.statusEffectCatalog[open.name].desc])
  ]) : null;
  // 點自己的頭像打開「查看自身」;分出勝負後(含打贏後的劇情殺)就不能點了
  const myFace = b.result || b.ending
    ? el("div", { class: "b-face shadow" })
    : el("button", { class: "b-face-btn", onclick: openStatus, "aria-label": "查看自身" }, [
        el("div", { class: "b-face shadow" }), el("span", null, ["查看自身"])
      ]);

  // 自己的狀態放進底部選項框的右半邊
  const meCls = ["b-me", fx && fx.hurt ? "b-hit" : "", fx && fx.dot ? "b-dot" : ""].join(" ").trim();
  const mePanel = el("div", dotColor ? { class: meCls, style: `--c:${dotColor}` } : { class: meCls }, [
    el("div", { class: "b-me-head" }, [myFace, el("div", { class: "b-me-id" }, [
      el("div", { class: "b-name" }, [playerName(), el("span", { class: "b-realm" }, [P.playerRealm || "？？？"])]),
      el("div", { class: "b-chips" }, chips)
    ])]),
    statBlock("hp", hpTrack, b.hp, P.hp),
    statBlock("mp", mpTrack, b.mp, P.mpMax),
    // 回看紀錄;分出勝負後(含打贏後的劇情殺)藏起來,但保留位置
    el("button", { class: b.result || b.ending ? "b-backlog-btn off" : "b-backlog-btn", onclick: openBacklog }, ["回看紀錄"]),
    meFloat,
    allyFloat,
    dotFloat,
    tip
  ]);

  // 前世殘念:畫完、按鈕放進畫面之後,再看這回合要不要出現
  const echoDelay = intro ? INTRO[intro].show * 1000 + 1500 : 1000;
  requestAnimationFrame(() => syncSoulEcho(echoDelay));
  const emblem = EMBLEMS[P.emblem];
  return el("div", {
    class: intro ? `battle b-enter-${intro}` : "battle",
    style: emblem ? `--emblem:url("data:image/svg+xml,${encodeURIComponent(emblem)}")` : ""
  }, [
    b.result || b.ending ? null : renderIntroVariants(),
    // 上方舞台:敵人的圖,名號與血條在頂端
    // 舞台和戰鬥紀錄是同一個框:圖鋪滿整個框,紀錄壓在下方;攻擊特效、符文陣、跳字放在紀錄上方的圖區(.b-view)
    el("section", { class: stageCls, style: stageStyle }, [
      cam,
      ...layers.overlays,
      dust,
      edge,
      el("div", { class: "b-view" }, [
        fxNode,
        rune,
        P.ally ? allyCard(b, P.ally) : null,
        atk ? (atk.hit ? el("span", { class: "b-float gold" }, ["？？？"]) : el("span", { class: "b-float miss" }, ["落空"])) : null
      ]),
      fx && fx.allyCut ? allyCutIn(P.ally, fx.allyCut) : null,
      el("div", { class: "b-log" }, lines),
      el("div", { class: "b-stage-top" }, [
        el("div", { class: "b-stage-meta" }, [el("span", null, [P.location]), el("i", { class: "b-emblem-top" }), el("span", null, [`第 ${b.turn + 1} 回合`])]),
        el("div", { class: "b-name" }, [el("span", { class: "b-name-text" }, [P.enemyName]), el("span", { class: "b-realm" }, ["？？？"])]),
        el("div", { class: "b-boss-bars" }, [
          statBlock("hp", el("div", { class: "b-track" }, [el("div", { class: "b-fill hp unknown" })]), "？？？"),
          statBlock("mp", el("div", { class: "b-track" }, [el("div", { class: "b-fill mp unknown" })]), "？？？")
        ])
      ])
    ]),
    renderBattleActions(animate, mePanel),
    ...(b.backlog && !b.result && !b.ending ? backlogSheet() : []),
    b.result ? el("div", b.duskDelay ? { class: "b-dusk", style: `animation-delay:${1.4 + b.duskDelay / 1000}s` } : { class: "b-dusk" }) : null,
    introNode
  ]);
}

// 戰鬥紀錄的一行:前面掛說話的人(你=金底、它=紅底、提示=藍框),行動的結果不掛
function logLine(line, attrs) {
  const P = battleDef();
  const whoLabel = { you: "你", enemy: P.enemyName, ally: P.ally ? P.ally.name : "援手", system: "提示" };
  return el("p", attrs, [
    el("span", { class: "b-who" }, line.who ? [el("b", null, [whoLabel[line.who]])] : []),
    el("span", { class: "b-text" }, [
      ...richText(line.text),
      line.value ? el("span", { class: line.value.startsWith("+") ? "b-val up" : "b-val" }, [line.value]) : null
    ])
  ]);
}

// 回看紀錄:這場戰鬥說過的每一句,依回合分段,打開時停在最新一行
function backlogSheet() {
  const b = state.battle;
  const close = () => { b.backlog = false; render(); };
  const items = [];
  let turn = -1;
  b.log.forEach(line => {
    if (line.turn !== turn) {
      turn = line.turn;
      items.push(el("h4", null, [`第 ${turn + 1} 回合`]));
    }
    items.push(logLine(line, { class: line.who || "result" }));
  });
  const list = el("div", { class: "b-backlog" }, items);
  requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });
  return [
    el("div", { class: "b-sheet-backdrop", onclick: close }),
    el("div", { class: "b-sheet backlog" }, [el("h3", null, ["回看紀錄"]), list, el("button", { class: "b-opt", onclick: close }, [el("span", null, ["返回"])])])
  ];
}

function renderPrologueEnd() {
  const P = CONTENT.prologueBattle;
  const won = state.battle.result === "win";
  const actions = dock([choiceButton("墜落", () => { state.phase = "select"; render(); })]);
  // 從黑暗中慢慢浮現
  return screen([
    panel([
      el("h1", null, ["撕裂"]),
      storyText([P.afterBattleIntro, won ? P.winText : null, P.tearText].filter(Boolean).join("\n\n"), [
        won ? el("div", { class: "meta" }, [P.winAchievement]) : null
      ], actions)
    ]),
    actions
  ], "fade-in");
}

function openStatus() {
  state.statusOpen = true;
  state.statusSlide = true; // 打開那一次從底部滑上來;之後重畫不再滑
  render();
}

function closeStatus() {
  state.statusOpen = false;
  render();
}

function statusButton() {
  return el("button", { class: "peek", onclick: openStatus }, ["查看自身"]);
}

function leanBar(left, right, value) {
  return el("div", { class: "lean" }, [
    el("span", null, [left]),
    el("div", { class: "lean-track" }, [
      value === null ? null : el("div", { class: "lean-mark", style: `left:${value}%` })
    ]),
    el("span", null, [right])
  ]);
}

// 序章裡一切模糊,數值全部顯示「？？？」
function renderStatus() {
  const blur = state.phase === "prologue";
  const unknown = "？？？";
  const idt = state.identity;
  const dm = idt && idt.innerDemon;
  let demonText = "尚未浮現";
  if (blur) demonText = unknown;
  else if (dm && state.innerDemonChoice) {
    const indulge = state.innerDemonChoice === "indulge";
    demonText = `${dm.theme}——你選擇了${indulge ? "順從" : "壓制"}：${indulge ? dm.indulge : dm.resist}`;
  }
  const rows = Object.keys(ATTR_EFFECTS).map(k => el("div", { class: "stat-row" }, [
    el("span", null, [k]),
    el("b", null, [blur ? unknown : String(state.attributes[k])]),
    el("span", null, [ATTR_EFFECTS[k]])
  ]));
  // 滿版的角色面板:蓋滿整個畫面,右上角 ✕ 關閉(電腦上 Esc 也能關),不用底部的選項
  const slide = state.statusSlide;
  state.statusSlide = false;
  return el("div", { class: slide ? "status-sheet slide-in" : "status-sheet", role: "dialog", "aria-label": "查看自身" }, [
    el("div", { class: "status-bar" }, [
      el("h2", null, ["查看自身"]),
      el("button", { class: "status-close", onclick: closeStatus, "aria-label": "關閉" }, ["✕"])
    ]),
    el("div", { class: "status-body" }, [panel([
    el("div", { class: "status-head" }, [
      el("div", { class: blur ? "portrait blur" : "portrait" }),
      el("div", null, [
        el("h1", null, [blur ? playerName() : idt.name]),
        el("div", { class: "meta" }, [blur ? unknown : `${idt.category}類 ‧ ${state.realm} ‧ 修為 ${state.cultivation}`])
      ])
    ]),
    el("h2", null, ["屬性"]),
    el("div", { class: "stat-list" }, rows),
    el("h2", null, ["靈根"]),
    el("div", { class: "text" }, [blur ? unknown : "未明"]),
    el("h2", null, ["心魔"]),
    el("div", { class: "text" }, [demonText]),
    el("h2", null, ["善惡"]),
    leanBar("善良", "邪惡", blur ? null : state.morality)
  ])])]);
}

function renderSelect() {
  return screen([
    panel([el("h1", null, ["選擇身份"])]),
    dock(BETA_IDENTITY_IDS.map(id => {
      const idt = getIdentity(id);
      return choiceButton(`${idt.name} —— ${idt.intro}`, () => startRun(id));
    }))
  ]);
}

function renderOpening() {
  const lines = CONTENT.worldOpening.join("\n");
  const actions = dock([choiceButton("尋找軀殼", goToCollision)]);
  return screen([panel([el("h1", null, ["遊魂降世"]), storyText(lines, [], actions)]), actions]);
}

function renderCollision() {
  const idt = state.identity;
  const actions = dock([choiceButton("繼續", goToTrial)]);
  return screen([
    panel([
      el("span", { class: "tag" }, [idt.category + "類"]),
      el("h1", null, [idt.name]),
      storyText(idt.collision || idt.intro, [renderAttrs(state.attributes)], actions)
    ]),
    actions
  ]);
}

function renderTrial() {
  const dm = state.identity.innerDemon;
  const actions = dock([
    choiceButton("順從 —— " + dm.indulge, () => chooseInnerDemon("indulge")),
    choiceButton("壓制 —— " + dm.resist, () => chooseInnerDemon("resist"))
  ]);
  return screen([
    panel([
      el("h1", null, ["心魔浮現：" + dm.theme]),
      storyText("識海深處，一股執念隱隱躁動。\n此刻，你要順從它，還是壓下它？", [], actions)
    ]),
    actions
  ]);
}

function renderTrialResult() {
  const dm = state.identity.innerDemon;
  const label = state.innerDemonChoice === "indulge" ? dm.indulge : dm.resist;
  const actions = dock([choiceButton("繼續下去", goToLoop)]);
  return screen([
    panel([
      el("h1", null, ["心魔烙印"]),
      storyText(`你選擇了「${label}」。\n這份傾向，已悄悄刻進了你的識海。`, [
        el("div", { class: "meta" }, ["善惡已成，融入識海。"])
      ], actions)
    ]),
    actions
  ]);
}

function renderLoop() {
  const scene = state.currentScene;
  const actions = dock(scene.choices.map(choice =>
    choiceButton(choice.label, () => chooseSceneOption(choice))
  ));
  return screen([
    panel([
      el("div", { class: "meta" }, [`第 ${state.round + 1} / ${ROUND_LIMIT} 段 ‧ 修為 ${state.cultivation}`]),
      el("h1", null, [state.identity.name]),
      storyText(scene.text, [], actions)
    ]),
    actions
  ]);
}

function renderLoopResult() {
  const choice = state.lastChoiceResult;
  const actions = dock([choiceButton("繼續", goToLoop)]);
  return screen([
    panel([
      el("h1", null, ["結果"]),
      storyText(choice.result, [
        el("div", { class: "meta" }, [
          choice.cultivationGain > 0 ? `修為 +${choice.cultivationGain}` : "這回合沒有明顯收穫"
        ])
      ], actions)
    ]),
    actions
  ]);
}

function renderSummary() {
  const dm = state.identity.innerDemon;
  const bias = state.innerDemonChoice === "indulge" ? dm.indulge : dm.resist;
  const actions = dock([choiceButton("回到大廳", restart)]);
  return screen([
    panel([
      el("h1", null, ["本輪到此告一段落"]),
      storyText(`身份：${state.identity.name}\n心魔傾向：${bias}\n累積修為：${state.cultivation}`, [], actions)
    ]),
    actions
  ]);
}

function render() {
  const app = document.getElementById("app");
  document.documentElement.dataset.font = state.font;
  document.documentElement.dataset.bar = state.barStyle;
  document.documentElement.classList.toggle("ui-new", state.uiStyle === "new");
  app.innerHTML = "";
  storyScreen = null;
  // 換到新的畫面才清掉閱讀進度;只是打開/關掉「查看自身」不算
  if (state.phase !== lastPhase) {
    storyProgress.clear();
    lastPhase = state.phase;
  }
  if (state.statusOpen) {
    app.appendChild(renderStatus());
    return;
  }
  if (STATUS_PHASES.includes(state.phase)) {
    app.appendChild(el("div", { class: "toolbar" }, [statusButton()]));
  }
  const renderers = {
    title: renderTitle,
    prologue: renderPrologue,
    prologueEnd: renderPrologueEnd,
    child: renderChild,
    select: renderSelect,
    opening: renderOpening,
    collision: renderCollision,
    trial: renderTrial,
    trialResult: renderTrialResult,
    loop: renderLoop,
    loopResult: renderLoopResult,
    summary: renderSummary
  };
  app.appendChild(renderers[state.phase]());
}

render();
</script>
</body>
</html>
