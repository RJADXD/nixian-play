  }
  @keyframes b-sheet-up {
    from { transform: translate(-50%, 100%); }
  }
  .b-sheet h3 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: .2em;
    color: var(--b-title);
  }
  /* 回看紀錄:選項框裡、自己狀態欄最下面的小按鈕,點了從底部滑出整場的紀錄,依回合分段 */
  .b-backlog-btn {
    padding: 1px 0;
    font: inherit;
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--b-title);
    background: rgba(10,7,5,.5);
    border: 1px solid var(--b-line);
    border-radius: 2px;
    cursor: pointer;
  }
  .b-backlog-btn.off { visibility: hidden; }
  .b-backlog-btn:hover, .b-backlog-btn:focus-visible { border-color: var(--b-icon); }
  .b-sheet.backlog { max-height: 78vh; }
  .b-backlog {
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--b-line) transparent;
  }
  .b-backlog h4 {
    margin: 12px 0 4px;
    padding-bottom: 3px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: .2em;
    color: var(--b-quiet);
    border-bottom: 1px dashed var(--b-line);
  }
  .b-backlog h4:first-child { margin-top: 0; }
  /* 點自己的頭像打開「查看自身」 */
  .b-face-btn {
    position: relative;
    flex: none;
    padding: 0;
    font: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }
  .b-face-btn span {
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: 1px;
    padding: 2px 0;
    font-size: 11px;
    letter-spacing: .1em;
    text-align: center;
    color: var(--b-title);
    background: rgba(10,7,5,.78);
  }
  .b-face-btn:hover .b-face, .b-face-btn:focus-visible .b-face {
    border-color: var(--b-icon);
    box-shadow: inset 0 0 12px rgba(0,0,0,.8), 0 0 10px rgba(201,164,92,.45);
  }
  .b-face-btn:focus-visible { outline: none; }

  /* ---- 演出:新的紀錄依序浮現 → 受擊/格擋/斬擊 → 跳字 ---- */
  .b-log p.fresh { animation: b-linein .35s ease-out both; }
  @keyframes b-linein {
    from { opacity: 0; transform: translateY(6px); }
  }
  .b-cmds.b-wait { animation: b-ready .3s .75s both; }
  @keyframes b-ready {
    from { opacity: .55; }
  }
  .b-hit { animation: b-shake .4s .3s; }
  .b-hit .b-face { animation: b-redflash .5s .3s; }
  @keyframes b-shake {
    20% { transform: translateX(-7px); }
    45% { transform: translateX(6px); }
    70% { transform: translateX(-3px); }
  }
  @keyframes b-redflash {
    30% { box-shadow: inset 0 0 0 100px rgba(224,87,75,.6), 0 0 16px rgba(224,87,75,.6); }
  }
  @keyframes b-whiteflash {
    30% { filter: brightness(2.2); }
  }

  /* ---- 攻擊演出:依出手方式不同,打中和落空也不同。全部 0.6 秒內收完,特效元素播完就拿掉 ---- */
  .b-fx {
    position: absolute;
    left: 50%;
    top: 58%;
    z-index: 1;
    height: min(120%, 330px); /* 跟著舞台高度走,舞台矮的時候特效不會被裁掉或蓋到名號 */
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .b-fx > * { position: absolute; }
  .b-fx * { animation-fill-mode: forwards !important; } /* 延遲期間保持隱藏,不要先露出第一格 */
  /* 斬擊(劍修,參考原神、八方旅人):刀光沿弧線一閃而過 → 打中時目標沿刀痕錯開、白閃、
     火花往刀痕兩側噴、畫面輕震,刀痕留一下才消失 */
  .b-fx svg.arc { inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke-linecap: round; }
  .b-fx .arc .trail { stroke-dasharray: .34 2; stroke-dashoffset: .34; animation: slash-trail .17s .05s cubic-bezier(.55,0,.9,.6) both; }
  .b-fx .arc .glow { stroke: rgba(240,200,120,.35); stroke-width: 8; }
  .b-fx .arc .edge { stroke: #ffd98a; stroke-width: 3; }
  .b-fx .arc .core { stroke: #fff; stroke-width: 1.1; }
  @keyframes slash-trail { to { stroke-dashoffset: -1.05; } }
  .b-fx .arc .scar { stroke: #fff6dc; opacity: 0; animation: slash-scar .55s .19s ease-out both; }
  @keyframes slash-scar {
    0% { opacity: 1; stroke-width: 1.8; }
    100% { opacity: 0; stroke-width: .3; }
  }
  .b-fx .spark {
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: 2px;
    margin-top: -1px;
    background: #fff3cf;
    box-shadow: 0 0 6px #ffd27a;
    opacity: 0;
    animation: slash-spark .32s ease-out;
  }
  @keyframes slash-spark {
    0% { opacity: 1; transform: rotate(var(--r)) translateX(0) scaleX(1); }
    100% { opacity: 0; transform: rotate(var(--r)) translateX(var(--d)) scaleX(.3); }
  }
  .b-enemy-art.split { background: none; }
  .b-enemy-art .half { position: absolute; inset: 0; border-radius: 50%; background: var(--enemy-art); }
  .b-enemy-art .half.a { clip-path: polygon(0 0, 100% 0, 0 100%); animation: split-a .42s .19s ease-out both; }
  .b-enemy-art .half.b { clip-path: polygon(100% 0, 100% 100%, 0 100%); animation: split-b .42s .19s ease-out both; }
  @keyframes split-a { 20% { transform: translate(-6px, -6px); filter: brightness(2.2); } }
  @keyframes split-b { 20% { transform: translate(6px, 6px); filter: brightness(2.2); } }
  /* 有敵人圖時,整張圖連背景一起反應:斬中閃一下、拳中往前一頓、落空閃爍 */
  .b-atk-hit.b-atk-slash .b-art.main { animation: art-flash .4s .19s ease-out; }
  @keyframes art-flash { 20% { filter: brightness(1.45); } }
  .b-atk-hit.b-atk-punch .b-art.main { animation: art-punch .55s .07s; }
  @keyframes art-punch {
    0%, 30% { transform: scale(1.05); filter: brightness(1.5); } /* 頓幀 */
    60% { transform: scale(.99); filter: brightness(1.1); }
  }
  .b-atk-miss .b-art.main { animation: art-miss .45s .18s; }
  @keyframes art-miss {
    20% { opacity: .5; }
    45% { opacity: .85; }
    70% { opacity: .6; }
  }
  /* 真身露出:金身沿劍痕裂成兩半往外滑開、淡掉,底下是真身;紅光一閃,舞台重震 */
  .b-art.shed.a { clip-path: polygon(0 0, 100% 0, 0 100%); animation: shed-a 1.2s ease-in forwards; }
  .b-art.shed.b { clip-path: polygon(100% 0, 100% 100%, 0 100%); animation: shed-b 1.2s ease-in forwards; }
  @keyframes shed-a {
    15% { transform: translate(-4px, -4px); filter: brightness(1.8); opacity: 1; }
    100% { transform: translate(-18%, -18%) rotate(-3deg); filter: brightness(.5); opacity: 0; }
  }
  @keyframes shed-b {
    15% { transform: translate(4px, 4px); filter: brightness(1.8); opacity: 1; }
    100% { transform: translate(18%, 18%) rotate(3deg); filter: brightness(.5); opacity: 0; }
  }
  .b-reveal-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 35%, rgba(190,24,36,.6), transparent 70%);
    opacity: 0;
    pointer-events: none;
    animation: reveal-flash 1.4s .25s ease-out;
  }
  @keyframes reveal-flash { 15% { opacity: 1; } }
  .b-stage.b-reveal { animation: shake-heavy .5s .15s; }
  .b-stage.b-atk-slash.b-atk-hit { animation: shake-light .22s .19s; }
  @keyframes shake-light {
    25% { transform: translateX(-4px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
  }
  /* 拳擊(體修,參考快打旋風、死亡細胞的打擊感):命中瞬間停頓(頓幀),目標被打扁再彈回;
     白光、衝擊星芒、衝擊波環、放射速度線、揚塵,頓幀結束後畫面重震 */
  .b-fx .flash {
    left: 30%;
    top: 30%;
    width: 40%;
    height: 40%;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0, rgba(255,240,205,.85) 35%, transparent 70%);
    opacity: 0;
    animation: punch-flash .22s .07s ease-out both;
  }
  @keyframes punch-flash {
    0% { opacity: 1; transform: scale(.3); }
    100% { opacity: 0; transform: scale(1.7); }
  }
  .b-fx svg.star {
    left: 27%;
    top: 27%;
    width: 46%;
    height: 46%;
    overflow: visible;
    fill: #fff6dc;
    stroke: #e9b860;
    stroke-width: 2;
    opacity: 0;
    animation: punch-star .42s .07s both;
  }
  @keyframes punch-star {
    0% { opacity: 1; transform: scale(.2) rotate(-8deg); }
    18% { opacity: 1; transform: scale(1) rotate(0); }
    50% { opacity: 1; transform: scale(1.04) rotate(2deg); }
    100% { opacity: 0; transform: scale(1.25) rotate(6deg); }
  }
  .b-fx .ring {
    left: 32%;
    top: 32%;
    width: 36%;
    height: 36%;
    border: 3px solid rgba(255,236,196,.95);
    border-radius: 50%;
    opacity: 0;
    animation: punch-ring .42s .1s ease-out both;
  }
  @keyframes punch-ring {
    0% { opacity: 1; transform: scale(.4); }
    100% { opacity: 0; transform: scale(2.3); }
  }
  .b-fx .line {
    left: 50%;
    top: 50%;
    width: 3px;
    height: 16%;
    margin-left: -1.5px;
    background: linear-gradient(rgba(255,243,214,0), #fff3d6);
    transform-origin: 50% 0;
    opacity: 0;
    animation: punch-line .3s .08s ease-out both;
  }
  @keyframes punch-line {
    0% { opacity: 1; transform: rotate(var(--a)) translateY(60%) scaleY(1); }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(240%) scaleY(.4); }
  }
  .b-fx .dust {
    left: 50%;
    top: 62%;
    width: 5px;
    height: 5px;
    margin: -2.5px;
    border-radius: 50%;
    background: rgba(214,190,150,.8);
    opacity: 0;
    animation: punch-dust .5s .12s ease-out both;
  }
  @keyframes punch-dust {
    0% { opacity: .9; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); }
  }
  .b-atk-hit.b-atk-punch .b-enemy-art { animation: punch-squash .55s .07s forwards, b-breathe 3s ease-in-out infinite; }
  @keyframes punch-squash {
    0%, 30% { transform: translate(-50%, -50%) scale(1.16, .84); filter: brightness(2.3); } /* 頓幀:停在被打扁的那一刻 */
    55% { transform: translate(-50%, -50%) scale(.93, 1.07); filter: brightness(1.2); }
    78% { transform: translate(-50%, -50%) scale(1.03, .97); filter: none; }
    100% { transform: translate(-50%, -50%); filter: none; }
  }
  .b-stage.b-atk-punch.b-atk-hit { animation: shake-heavy .42s .23s; }
  @keyframes shake-heavy {
    10% { transform: translate(-8px, 5px); }
    25% { transform: translate(7px, -4px); }
    40% { transform: translate(-5px, 3px); }
    55% { transform: translate(4px, -2px); }
    70% { transform: translate(-2px, 1px); }
    85% { transform: translate(1px, 0); }
  }
  /* 落空:目標像幻影一樣晃開 */
  .b-atk-miss .b-enemy-art { animation: b-breathe 3s ease-in-out infinite, miss-shimmer .45s .18s; }
  @keyframes miss-shimmer {
    20% { transform: translate(calc(-50% - 8px), -50%); opacity: .3; }
    45% { transform: translate(calc(-50% + 6px), -50%); opacity: .7; }
    70% { transform: translate(calc(-50% - 2px), -50%); opacity: .4; }
  }
  /* 跳字:大字加筆刷底,彈出後往上飄走 */
  .b-float {
    position: absolute;
    top: 8px;
    right: 22%;
    z-index: 2;
    isolation: isolate;
    padding: 0 14px;
    font-size: 34px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: .02em;
    color: #ff6a58;
    text-shadow: 0 2px 0 #3a0a06, 0 0 12px rgba(255,90,70,.6);
    pointer-events: none;
    animation: b-float 1.2s .3s ease-out both;
  }
  .b-float::before {
    content: "";
    position: absolute;
    inset: 32% -10% 18% -14%;
    z-index: -1;
    background: linear-gradient(90deg, transparent, rgba(140,24,16,.9) 18%, rgba(196,58,30,.85) 70%, transparent);
    border-radius: 50% 12% 50% 12%;
    transform: skewX(-24deg);
  }
  .b-float small {
    margin-right: 4px;
    font-size: .5em;
    font-style: normal;
    vertical-align: middle;
  }
  .b-float.silver { color: var(--b-silver); text-shadow: 0 2px 0 #1d2329, 0 0 12px rgba(221,228,234,.7); }
  .b-float.silver::before { background: linear-gradient(90deg, transparent, rgba(90,104,118,.85) 18%, rgba(140,154,168,.8) 70%, transparent); }
  .b-float.gold { color: #ffe1a0; text-shadow: 0 2px 0 #3a2606, 0 0 12px rgba(255,210,122,.7); }
  .b-float.gold::before { background: linear-gradient(90deg, transparent, rgba(150,104,24,.9) 18%, rgba(200,150,50,.85) 70%, transparent); }
  .b-float.miss { font-size: 26px; color: #d8d0c2; text-shadow: 0 2px 0 #1a1714, 0 0 8px rgba(0,0,0,.6); }
  .b-float.miss::before { background: linear-gradient(90deg, transparent, rgba(70,66,60,.85) 18%, rgba(110,104,96,.8) 70%, transparent); }

  /* ---- 點選回饋:被選的選項金光掃過、外框殘影往外散,其他選項淡掉;戰鬥指令留一條「上次用過」的金色記號 ---- */
  button.choice, .b-act, .b-opt { position: relative; }
  .pick-fx {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: inherit;
    pointer-events: none;
  }
  .pick-fx::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 60%;
    background: linear-gradient(100deg, transparent, rgba(255,240,205,.7) 42%, rgba(255,255,255,.95) 50%, rgba(255,240,205,.7) 58%, transparent);
    transform: translateX(-120%) skewX(-18deg);
    animation: pick-sweep .32s ease-out forwards;
  }
  @keyframes pick-sweep { to { transform: translateX(220%) skewX(-18deg); } }
  .pick-ghost {
    position: absolute;
    inset: -1px;
    border: 1px solid rgba(240,210,140,.95);
    border-radius: inherit;
    pointer-events: none;
    animation: pick-ghost .45s ease-out forwards;
  }
  @keyframes pick-ghost {
    from { opacity: .95; transform: scale(1); }
    to { opacity: 0; transform: scale(1.05, 1.4); }
  }
  button.choice.chosen, .b-opt.chosen {
    border-color: #e9c77b;
    color: #fff3d6;
    box-shadow: inset 0 1px 0 rgba(255,230,190,.25), inset 0 0 18px rgba(233,199,123,.3), 0 0 12px rgba(233,199,123,.45), 0 3px 0 #0a0705;
  }
  .picked { pointer-events: none; }
  .picked > :is(button.choice, .b-opt):not(.chosen) { opacity: .3; transition: opacity .2s; }
  .b-act.last, .b-act.chosen, .b-act.open { border-color: rgba(233,199,123,.8); }
  .b-act.last::before, .b-act.chosen::before, .b-act.open::before {
    content: "";
    position: absolute;
    left: -1px;
    top: 22%;
    bottom: 22%;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: #e9c77b;
    box-shadow: 0 0 6px rgba(233,199,123,.8);
  }
  .b-act.chosen { animation: act-chosen .7s ease-out both; }
  @keyframes act-chosen {
    0% { border-color: #fff1c9; box-shadow: inset 0 0 22px rgba(255,236,190,.55), 0 0 18px rgba(233,199,123,.8), 0 3px 0 #0a0705; }
  }

  /* ---- 選項因為當前情況改變:外框亮起(金邊呼吸＋流光掃過,參考崩鐵終結技就緒、原神可領取)、變模糊 ---- */
  .b-act.glow, .b-act.lit, .b-opt.lit, .b-opt.glow { overflow: hidden; border-color: #e9c77b; }
  .b-act.glow, .b-opt.glow { animation: opt-glow 1.6s ease-in-out infinite; }
  .b-act.glow.chosen { animation: act-chosen .7s ease-out, opt-glow 1.6s .7s ease-in-out infinite; }
  .b-act.lit, .b-opt.lit { animation: opt-glow .7s ease-in-out 3; }
  @keyframes opt-glow {
    50% { box-shadow: inset 0 1px 0 rgba(255,230,190,.25), inset 0 0 14px rgba(233,199,123,.25), 0 0 0 1px rgba(233,199,123,.55), 0 0 16px rgba(233,199,123,.55), 0 3px 0 #0a0705; }
  }
  .b-act.glow::after, .b-act.lit::after, .b-opt.lit::after, .b-opt.glow::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 35%;
    background: linear-gradient(100deg, transparent, rgba(255,236,190,.4), transparent);
    transform: translateX(-120%) skewX(-18deg);
    animation: opt-sweep 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  .b-act.lit::after, .b-opt.lit::after { animation: opt-sweep 1s ease-in-out 2; }
  @keyframes opt-sweep {
    0% { transform: translateX(-120%) skewX(-18deg); }
    50%, 100% { transform: translateX(380%) skewX(-18deg); }
  }
  .b-act.dim { opacity: .45; filter: blur(.7px) grayscale(.7); }
  .b-act.dim-in { animation: opt-dim-in .9s .5s ease-in both; }
  @keyframes opt-dim-in { from { opacity: 1; filter: none; } }
  .b-float.dot { color: color-mix(in srgb, var(--c) 40%, #fff); text-shadow: 0 2px 0 #0d1209, 0 0 12px var(--c); }
  .b-float.dot::before { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 80%, #000) 18%, var(--c) 70%, transparent); }
  /* 狀態發作:頭像閃一下狀態的顏色,排在受擊紅閃之後 */
  .b-dot .b-face { animation: b-dotflash .5s .6s; }
  .b-hit.b-dot .b-face { animation: b-redflash .5s .3s, b-dotflash .5s 1.1s; }
  @keyframes b-dotflash {
    30% { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--c) 60%, transparent), 0 0 16px var(--c); }
  }
  @keyframes b-float {
    0% { opacity: 0; transform: scale(1.9); }
    14% { opacity: 1; transform: scale(1); }
    70% { opacity: 1; transform: translateY(-12px); }
    100% { opacity: 0; transform: translateY(-26px); }
  }
  /* ---- 進場演出(測試用三種) ---- */
  .b-intro {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
  }
  /* 1 劍光劈開:黑幕被一道斜斜的劍光劈成兩半,往上下裂開 */
  .b-intro.v1::before, .b-intro.v1::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #080604;
    animation: .55s .75s cubic-bezier(.6,0,.3,1) both;
  }
  .b-intro.v1::before { clip-path: polygon(0 0, 100% 0, 100% 40%, 0 60%); animation-name: b-split-up; }
  .b-intro.v1::after { clip-path: polygon(0 60%, 100% 40%, 100% 100%, 0 100%); animation-name: b-split-down; }
  @keyframes b-split-up { to { transform: translate(-3%, -70%); } }
  @keyframes b-split-down { to { transform: translate(3%, 70%); } }
  .b-intro-line {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 1;
    width: 130vmax;
    height: 3px;
    background: linear-gradient(90deg, transparent, #fff3d6 15%, #ffd27a 85%, transparent);
    box-shadow: 0 0 14px #ffd27a, 0 0 30px rgba(255,210,122,.6);
    transform: translate(-50%, -50%) rotate(var(--a)) scaleX(0);
    animation: b-line-draw .3s .25s ease-in both, b-line-out .4s .8s both;
  }
  @keyframes b-line-draw { to { transform: translate(-50%, -50%) rotate(var(--a)) scaleX(1); } }
  @keyframes b-line-out { to { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) scale(1, 4); } }
  /* 2 黑幕印章:「戰」字印章蓋下去、畫面一震,黑幕往上下拉開 */
  .b-intro.v2::before, .b-intro.v2::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 50.5%;
    background: #080604;
    animation: .6s 1.15s cubic-bezier(.6,0,.3,1) both;
  }
  .b-intro.v2::before { top: 0; animation-name: b-bar-up; }
  .b-intro.v2::after { bottom: 0; animation-name: b-bar-down; }
  @keyframes b-bar-up { to { transform: translateY(-100%); } }
  @keyframes b-bar-down { to { transform: translateY(100%); } }
  .b-seal {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 1;
    width: 88px;
    height: 88px;
    margin: -44px 0 0 -44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 700;
    color: #f3ead8;
    background: #a8322d;
    border-radius: 6px;
    box-shadow: 0 0 0 3px rgba(168,50,45,.35), 0 10px 30px rgba(0,0,0,.6);
    animation: b-stamp .35s .2s cubic-bezier(.3,1.6,.5,1) both, b-seal-out .35s 1.05s both;
  }
  @keyframes b-stamp {
    from { opacity: 0; transform: scale(2.4) rotate(-12deg); }
    to { opacity: 1; transform: scale(1) rotate(-4deg); }
  }
  @keyframes b-seal-out {
    from { opacity: 1; transform: scale(1) rotate(-4deg); }
    to { opacity: 0; transform: scale(.9) rotate(-4deg); }
  }
  .b-intro.v2 { animation: b-shake .3s .5s; }
  /* 3 霧散名號:名號浮現,黑霧從中間往四周散開,各區塊依序就位 */
  .b-intro.v3 { animation: b-fog 2s ease-out both; }
  @keyframes b-fog {
    0%, 35% { background: rgba(8,6,4,1); box-shadow: inset 0 0 160px 22vmin rgba(8,6,4,1); }
    60% { background: rgba(8,6,4,0); box-shadow: inset 0 0 160px 22vmin rgba(8,6,4,.95); }
    100% { background: rgba(8,6,4,0); box-shadow: inset 0 0 0 0 rgba(8,6,4,0); }
  }
  .b-title {
    position: absolute;
    left: 0;
    right: 0;
    top: 42%;
    text-align: center;
    animation: b-title 1.9s ease-out both;
  }
  .b-title b {
    display: block;
    padding-left: .5em;
    font-size: 40px;
    letter-spacing: .5em;
    color: var(--b-title);
    text-shadow: 0 0 18px rgba(226,196,135,.5);
  }
  .b-title i {
    display: block;
    width: min(420px, 70%);
    height: 1px;
    margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, var(--b-icon), transparent);
    animation: b-rule .8s .3s ease-out both;
  }
  @keyframes b-title {
    0% { opacity: 0; }
    15%, 60% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes b-rule {
    from { transform: scaleX(0); }
  }
  .battle:is(.b-enter-3, .b-enter-4) > :is(.b-frame, .console) { animation: b-rise .5s ease-out both; }
  /* 測試切換:預設收起只佔一行,點開才有三排按鈕 */
  .b-tests {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--b-quiet);
  }
  .b-tests summary {
    padding: 4px 10px;
    border: 1px dashed var(--b-line);
    border-radius: 3px;
    cursor: pointer;
  }
  .b-tests[open] summary { margin-bottom: 6px; }
  .battle:is(.b-enter-3, .b-enter-4) > :nth-child(2) { animation-delay: 1.3s; }
  .battle:is(.b-enter-3, .b-enter-4) > :nth-child(3) { animation-delay: 1.45s; }
  .battle:is(.b-enter-3, .b-enter-4) > :nth-child(4) { animation-delay: 1.6s; }
  /* 4 迷霧碎裂(鏡面碎裂,參考二遊的進戰鬥):
     名號在迷霧中浮現 → 0.85s 正中一擊,蛛網裂痕擴散、畫面一推一震、名號紅藍錯位
     → 碎片先微微錯開 → 中間的往鏡頭飛、外圈的翻轉掉落,邊緣反光、亮光滑過 → 殘霧散去 */
  .b-intro.v4 {
    perspective: 900px;
    animation: b-push .45s .85s ease-out both;
  }
  @keyframes b-push {
    0% { transform: none; }
    20% { transform: translateX(-6px) scale(1.025); }
    45% { transform: translateX(5px) scale(1.02); }
    100% { transform: scale(1.015); }
  }
  .b-intro-fog {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 160px 22vmin rgba(8,6,4,.95);
    animation: b-fog-out 1s 1.4s ease-out both;
  }
  @keyframes b-fog-out {
    to { opacity: 0; }
  }
  /* 每片只有自己的外框大小(位置、大小在 JS 算),裡面墊一張整個畫面大小的底圖,超出碎片的部分裁掉。
     碎片裡的東西只用不會另開圖層的動畫(重畫顏色、背景位置),整個演出的圖層數才不會爆掉 */
  .b-shard {
    position: absolute;
    overflow: hidden;
    backface-visibility: visible;
    animation: b-glass 1.15s var(--delay) both;
  }
  .b-shard-in, .b-shard.b-base {
    position: absolute;
    background: radial-gradient(ellipse at 50% 45%, #1f1913 0, #080604 65%);
  }
  .b-shard.b-base { inset: 0; overflow: visible; }
  @keyframes b-glass {
    0% {
      visibility: hidden; /* 正中一擊之前不出現,底下那一整張先撐著 */
      transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      animation-timing-function: ease-out;
    }
    28% {
      transform: translate3d(var(--nx), var(--ny), 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      animation-timing-function: cubic-bezier(.45,0,.85,.55);
    }
    80% { opacity: 1; }
    100% {
      opacity: 0;
      transform: translate3d(var(--dx), var(--dy), var(--dz)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz));
    }
  }
  /* 碎片底下墊一整張,裂開前不會從碎片接縫透出後面的畫面;碎片飛出那一刻才拿掉 */
  .b-shard.b-base { animation: b-base-out .12s 1.12s both; }
  @keyframes b-base-out {
    to { opacity: 0; }
  }
  .b-shard.b-base .b-title { animation: b-title-in .5s .2s ease-out both; }
  .b-shard-in .b-title, .b-shard-in .b-title i { animation: none; }
  @keyframes b-title-in {
    from { opacity: 0; }
  }
  .b-shard .b-title b { animation: b-chroma .4s .85s both; }
  @keyframes b-chroma {
    0% { text-shadow: 0 0 18px rgba(226,196,135,.5); }
    30% { text-shadow: -4px 0 rgba(255,70,70,.85), 4px 0 rgba(70,220,255,.85), 0 0 18px rgba(226,196,135,.5); }
    100% { text-shadow: -1.5px 0 rgba(255,70,70,.5), 1.5px 0 rgba(70,220,255,.5), 0 0 18px rgba(226,196,135,.5); }
  }
  /* 碎片表面的反光:一道亮帶隨著翻轉滑過 */
  .b-glint {
    position: absolute;
    inset: 0;
    background: linear-gradient(var(--g), transparent 42%, rgba(255,255,255,.07) 46%, rgba(255,255,255,.42) 50%, rgba(200,235,255,.12) 54%, transparent 58%);
    background-size: 300% 300%;
    opacity: .6;
    animation: b-glint 1.15s var(--delay) both;
  }
  /* 亮帶一開始和最後都在碎片外面,中段才滑過,所以不用再淡入淡出 */
  @keyframes b-glint {
    from { background-position: 100% 100%; }
    to { background-position: 0% 0%; }
  }
  /* 碎片邊緣:玻璃斷面反光 */
  .b-edge {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-opacity: 0;
    stroke-width: 2.5;
    stroke-linejoin: round;
    animation: b-edge .25s both;
    animation-delay: calc(var(--delay) + .25s);
  }
  @keyframes b-edge {
    to { stroke-opacity: .9; }
  }
  /* 蛛網裂痕:先放射、再一圈圈連起來 */
  .b-cracks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #f4f8ff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 3px rgba(170,220,255,.9));
    animation: b-cracks .55s .85s both;
  }
  @keyframes b-cracks {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; }
  }
  .b-cracks .rad, .b-cracks .ring {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: b-draw .18s .85s ease-out both;
  }
  .b-cracks .ring { stroke-width: 1.4; animation-delay: .97s; }
  @keyframes b-draw {
    to { stroke-dashoffset: 0; }
  }
  .b-impact {
    position: absolute;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0, rgba(200,235,255,.6) 40%, transparent 70%);
    animation: b-impact .45s .85s ease-out both;
  }
  @keyframes b-impact {
    0% { opacity: 0; transform: scale(0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: scale(30); }
  }
  /* 玻璃碎屑 */
  .b-spark {
    position: absolute;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    background: #fff;
    box-shadow: 0 0 8px rgba(190,230,255,.9);
    opacity: 0;
    animation: b-spark .8s ease-out both;
  }
  @keyframes b-spark {
    0% { opacity: 0; transform: translate(0, 0) rotate(45deg) scale(var(--s)); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--px), var(--py)) rotate(225deg) scale(.2); }
  }

  /* 戰鬥結束:黑暗從四周慢慢籠罩,蓋滿後切到下一個畫面(總長要跟 DUSK_MS 對得上) */
  .b-dusk {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    animation: b-dusk 2.6s 1.4s ease-in-out both;
  }
  @keyframes b-dusk {
    from { box-shadow: inset 0 0 0 0 rgba(8,6,4,0); background: rgba(8,6,4,0); }
    20% { box-shadow: inset 0 0 120px 0 rgba(8,6,4,.9); background: rgba(8,6,4,0); }
    75% { box-shadow: inset 0 0 160px 22vmin rgba(8,6,4,.97); background: rgba(8,6,4,.35); }
    to { box-shadow: inset 0 0 160px 22vmin rgba(8,6,4,1); background: rgba(8,6,4,1); }
  }
  .fade-in { animation: fade-in 1.2s ease-out both; }
  @keyframes fade-in {
    from { opacity: 0; }
  }

  /* ---- 第一次進遊戲的開場(全螢幕,見 awakenIntro),總長 12 秒(要跟 AWAKEN_MS 對得上)----
     主角在做惡夢(參考蔚藍檔案開頭的模糊視角、眨眼、字幕框):
     第一次睜眼(先半睜成一條縫):白煙、模糊的金色人影、飄落的金色花瓣,浮出一句問話;
     第二次睜眼:字消失,火光從下面燒上來,字幕「……閉上眼睛。」;
     第三次睜眼:金光亮起、越來越亮,夢散了;閉眼,黑暗裡有人叫你「……喂，醒醒。」;
     最後一次睜眼(一樣先半睜):眼前是雪梅花,從模糊慢慢對焦。
     上下眼皮是兩片羽化的黑幕,睜眼 = 往上下退開。百分比 = 12 秒裡的時間點(例如 37% ≈ 4.45 秒) */
  .awaken {
    position: fixed;
    inset: 0;
    z-index: 60;
    overflow: hidden;
    background: #000;
  }
  .awaken > i { position: absolute; pointer-events: none; }
  /* 夢:好幾張模糊的畫面輪流出現(content.js 的 dreamArts),整層慢慢推近。
     只用兩層圖輪流換(.on 的那張淡入、另一張淡出),模糊只套在外層一次,圖再多手機也吃得消 */
  .aw-dream {
    inset: -8%;
    filter: blur(12px) brightness(.5) saturate(1.2);
    animation: aw-dream 12s linear both;
  }
  .aw-dream-img {
    position: absolute;
    inset: 0;
    background: center 30% / cover no-repeat;
    opacity: 0;
    transition: opacity .9s ease-in-out;
  }
  .aw-dream-img.on { opacity: 1; }
  @keyframes aw-dream {
    0%, 6.7% { opacity: 0; transform: scale(1.12); }
    14% { opacity: .9; }
    74% { opacity: .9; }
    80%, 100% { opacity: 0; transform: scale(1.02); }
  }
  /* 淡淡的白煙,慢慢飄 */
  .awaken-smoke {
    left: -25%;
    top: -25%;
    width: 150%;
    height: 150%;
    background:
      radial-gradient(ellipse 30% 16% at 36% 46%, rgba(236,236,242,.22), transparent 70%),
      radial-gradient(ellipse 24% 14% at 63% 54%, rgba(236,236,242,.18), transparent 70%),
      radial-gradient(ellipse 42% 20% at 50% 63%, rgba(236,236,242,.12), transparent 70%),
      radial-gradient(ellipse 28% 15% at 58% 38%, rgba(236,236,242,.14), transparent 70%);
    animation: smoke-in 12s linear both, smoke-drift 7s ease-in-out infinite alternate;
  }
  @keyframes smoke-in { 0%, 6.7% { opacity: 0; } 15%, 74% { opacity: 1; } 80%, 100% { opacity: 0; } }
  @keyframes smoke-drift {
    from { transform: translate(-3%, 1%) rotate(-2deg); }
    to { transform: translate(3%, -2%) rotate(2deg); }
  }
  /* 第二次睜眼:火光從下面燒上來,忽明忽暗 */
  .aw-fire {
    left: -10%;
    right: -10%;
    bottom: -10%;
    height: 80%;
    background: radial-gradient(ellipse 60% 70% at 50% 100%, rgba(255,120,40,.75), rgba(200,40,20,.4) 45%, transparent 75%);
    transform-origin: 50% 100%;
    animation: aw-fire 12s linear both, aw-flicker .35s steps(2) infinite;
  }
  @keyframes aw-fire { 0%, 40.8% { opacity: 0; } 46%, 57% { opacity: 1; } 61%, 100% { opacity: 0; } }
  @keyframes aw-flicker { 50% { transform: scaleY(.93) scaleX(1.03); } }
  /* 飄落的金色花瓣(囈花) */
  .aw-petals { inset: 0; overflow: hidden; animation: smoke-in 12s linear both; }
  .aw-petals b {
    position: absolute;
    top: -5%;
    left: var(--x);
    width: var(--s);
    height: calc(var(--s) * .6);
    border-radius: 60% 0 60% 0;
    background: #ffd98a;
    box-shadow: 0 0 8px 1px rgba(255,200,90,.8);
    animation: aw-petal var(--d) linear var(--delay) infinite;
  }
  @keyframes aw-petal {
    from { transform: translate(0, 0) rotate(0); }
    to { transform: translate(var(--dx), 110vh) rotate(540deg); }
  }
  /* 第三次睜眼:金光從中間亮起,越來越亮,夢就散了 */
  .awaken-gold {
    inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(255,240,200,1) 0, rgba(255,214,130,.7) 25%, rgba(240,190,90,.25) 50%, rgba(240,190,90,0) 72%);
    animation: awaken-gold 12s ease-in both;
  }
  @keyframes awaken-gold { 0%, 63.3% { opacity: 0; } 72% { opacity: .55; } 78% { opacity: 1; } 81%, 100% { opacity: 0; } }
  /* 醒來:眼前是雪梅花,從模糊慢慢對焦(圖用 sceneStage 鋪) */
  .aw-wake {
    inset: 0;
    overflow: hidden;
    container-type: size;
    background: #0a0705;
    animation: aw-wake 12s ease-out both;
  }
  @keyframes aw-wake {
    0%, 80% { opacity: 0; filter: blur(18px) brightness(.8); transform: scale(1.08); }
    82.5% { opacity: 1; filter: blur(18px) brightness(.8); transform: scale(1.08); }
    89% { filter: blur(9px) brightness(.9); }
    97%, 100% { opacity: 1; filter: blur(0) brightness(1); transform: scale(1); }
  }
  /* 眼皮:上下兩片羽化得很柔的黑幕,看不出形狀(不做有邊的弧形);睜眼 = 往上下退開。四周再壓一圈暗角 */
  .aw-vignette { inset: 0; box-shadow: inset 0 0 140px 50px rgba(0,0,0,.85); }
  .awaken-lid {
    left: 0;
    right: 0;
    height: 75%;
    animation: 12s both;
  }
  .awaken-lid.top {
    top: 0;
    background: linear-gradient(180deg, #000 0%, #000 66%, rgba(0,0,0,.9) 74%, rgba(0,0,0,.5) 86%, rgba(0,0,0,0) 100%);
    animation-name: lid-top;
  }
  .awaken-lid.bottom {
    bottom: 0;
    background: linear-gradient(0deg, #000 0%, #000 66%, rgba(0,0,0,.9) 74%, rgba(0,0,0,.5) 86%, rgba(0,0,0,0) 100%);
    animation-name: lid-bottom;
  }
  /* 睜眼的位置:0 = 閉著、-40% = 半睜(中間一條模糊的縫)、-105% = 完全睜開。
     閉眼很快(約 0.15 秒),睜眼慢;最後醒來時,半睜的時候會再眨一下 */
  @keyframes lid-top {
    0%, 6.7% { transform: translateY(0); animation-timing-function: ease-out; }
    10.8%, 12.5% { transform: translateY(-40%); animation-timing-function: ease-in-out; }
    15.8%, 35.8% { transform: translateY(-105%); animation-timing-function: ease-in; }
    37%, 40% { transform: translateY(0); animation-timing-function: ease-out; }
    43.3%, 58.3% { transform: translateY(-105%); animation-timing-function: ease-in; }
    59.6%, 62.5% { transform: translateY(0); animation-timing-function: ease-out; }
    66.7%, 77.5% { transform: translateY(-105%); animation-timing-function: ease-in-out; }
    79.6%, 82.5% { transform: translateY(0); animation-timing-function: ease-out; }
    86.7% { transform: translateY(-40%); animation-timing-function: ease-in; }
    88% { transform: translateY(0); animation-timing-function: ease-out; }
    89.2% { transform: translateY(-40%); animation-timing-function: ease-in-out; }
    94.2%, 100% { transform: translateY(-105%); }
  }
  @keyframes lid-bottom {
    0%, 6.7% { transform: translateY(0); animation-timing-function: ease-out; }
    10.8%, 12.5% { transform: translateY(40%); animation-timing-function: ease-in-out; }
    15.8%, 35.8% { transform: translateY(105%); animation-timing-function: ease-in; }
    37%, 40% { transform: translateY(0); animation-timing-function: ease-out; }
    43.3%, 58.3% { transform: translateY(105%); animation-timing-function: ease-in; }
    59.6%, 62.5% { transform: translateY(0); animation-timing-function: ease-out; }
    66.7%, 77.5% { transform: translateY(105%); animation-timing-function: ease-in-out; }
    79.6%, 82.5% { transform: translateY(0); animation-timing-function: ease-out; }
    86.7% { transform: translateY(40%); animation-timing-function: ease-in; }
    88% { transform: translateY(0); animation-timing-function: ease-out; }
    89.2% { transform: translateY(40%); animation-timing-function: ease-in-out; }
    94.2%, 100% { transform: translateY(105%); }
  }
  /* 白煙裡的問話:一個字一個字從模糊裡浮出來,上下各一道細金線;閉眼時消失 */
  .awaken-q {
    position: absolute;
    left: 0;
    right: 0;
    top: 40%;
    padding: 0 16px;
    text-align: center;
    pointer-events: none;
    animation: awaken-q 12s linear both;
  }
  @keyframes awaken-q { 0%, 35.8% { opacity: 1; } 37%, 100% { opacity: 0; } }
  .awaken-q::before, .awaken-q::after {
    content: "";
    display: block;
    width: min(320px, 70%);
    height: 1px;
    margin: 0 auto;
    background: linear-gradient(90deg, transparent, rgba(240,210,140,.85), transparent);
    animation: aw-rule 1s 1.6s ease-out both;
  }
  .awaken-q::before { margin-bottom: 14px; }
  .awaken-q::after { margin-top: 14px; }
  @keyframes aw-rule { from { transform: scaleX(0); opacity: 0; } }
  .awaken-q span {
    display: inline-block;
    font-size: clamp(22px, 6.4vw, 38px);
    letter-spacing: .28em;
    margin-right: -.28em;
    color: rgba(250,246,238,.95);
    text-shadow: 0 0 18px rgba(255,236,190,.55), 0 0 2px rgba(0,0,0,.7);
    animation: aw-char .7s ease-out both;
    animation-delay: calc(1.8s + var(--i) * .13s);
  }
  @keyframes aw-char { from { opacity: 0; filter: blur(8px); transform: translateY(8px); } }
  /* 字幕框(參考蔚藍檔案):說話的人不知道是誰,標「？？？」;閉著眼也聽得到,所以疊在眼皮上面 */
  .aw-sub {
    position: absolute;
    left: 50%;
    bottom: calc(12% + env(safe-area-inset-bottom, 0px));
    z-index: 1;
    width: min(560px, calc(100% - 32px));
    padding: 10px 18px 14px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(14,10,8,.5), rgba(14,10,8,.82));
    border-top: 1px solid rgba(233,199,123,.55);
    border-bottom: 1px solid rgba(233,199,123,.25);
    color: #f3ead8;
    font-size: 17px;
    letter-spacing: .1em;
    pointer-events: none;
    opacity: 0;
    animation: 12s linear both;
  }
  .aw-sub b { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: .25em; color: #e9c77b; }
  .aw-sub.s1 { animation-name: aw-sub1; }
  .aw-sub.s2 { animation-name: aw-sub2; }
  @keyframes aw-sub1 { 0%, 44% { opacity: 0; } 46%, 56% { opacity: 1; } 58.3%, 100% { opacity: 0; } }
  @keyframes aw-sub2 { 0%, 76% { opacity: 0; } 78%, 89% { opacity: 1; } 91%, 100% { opacity: 0; } }
  .awaken-skip {
    position: absolute;
    right: max(16px, env(safe-area-inset-right, 0px));
    top: calc(16px + env(safe-area-inset-top, 0px));
    z-index: 2;
    padding: 2px 14px;
    font: inherit;
    font-size: 12px;
    letter-spacing: .2em;
    color: rgba(240,236,228,.55);
    background: transparent;
    border: 1px solid rgba(240,236,228,.25);
    border-radius: 999px;
    cursor: pointer;
    animation: fade-in .6s 1s both;
  }
  /* 開場播完:全螢幕的雪梅花慢慢淡掉,底下露出同一張圖的劇情畫面 */
  .awaken.out { pointer-events: none; background: transparent; animation: awaken-out 1.2s ease-out forwards; }
  .awaken.out .aw-wake { animation: none; }
  @keyframes awaken-out { to { opacity: 0; } }
  /* 有圖的劇情段落:圖鋪滿上方,文字壓在圖的下緣(跟戰鬥畫面一樣) */
  .child-scene {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    container-type: size;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0a0705;
  }
  .child-scene::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 40px rgba(0,0,0,.6); pointer-events: none; }
  .child-scene .scene-text {
    position: relative;
    z-index: 1;
    max-height: 62%;

  /* 段落的圖(見 sceneStage):跟 background-size: cover 一樣鋪滿,對齊點是 content.js 的 artPos(--px、--py) */
  .scene-stage {
    position: absolute;
    width: max(100cqw, calc(100cqh * var(--ar)));
    aspect-ratio: var(--ar);
    left: calc((100cqw - max(100cqw, calc(100cqh * var(--ar)))) * var(--px) / 100);
    top: calc((100cqh - max(100cqh, calc(100cqw * var(--ari)))) * var(--py) / 100);
  }

  .scene-base { inset: 0; width: 100%; height: 100%; }

  @keyframes scene-breathe { to { transform: scale(1.025); } }

    background: #f7c1cf;
    opacity: .85;
    animation: scene-petal var(--d) linear var(--delay) infinite;
  }
