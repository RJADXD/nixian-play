<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<!-- 暫代頭像:雪梅花(白髮小女孩、頭上一朵梅花)。正式立繪出來後替換 -->
<defs>
<radialGradient id="bg" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#f6c6d6"/><stop offset=".65" stop-color="#b8607e"/><stop offset="1" stop-color="#4a1a2c"/></radialGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3ee"/></linearGradient>
<g id="plum"><circle cx="0" cy="-9" r="8"/><circle cx="8.6" cy="-2.8" r="8"/><circle cx="5.3" cy="7.3" r="8"/><circle cx="-5.3" cy="7.3" r="8"/><circle cx="-8.6" cy="-2.8" r="8"/></g>
</defs>
<rect width="400" height="400" fill="url(#bg)"/>
<g fill="#ffe3ec" opacity=".55"><use href="#plum" transform="translate(52 70) scale(.8)"/><use href="#plum" transform="translate(344 96) scale(.6)"/><use href="#plum" transform="translate(330 300) scale(.9)"/><use href="#plum" transform="translate(64 318) scale(.55)"/></g>
<!-- 後髮 -->
<path d="M200 74 C120 74 92 140 96 210 C100 290 84 350 70 400 L330 400 C316 350 300 290 304 210 C308 140 280 74 200 74Z" fill="url(#hair)"/>
<!-- 身體 -->
<path d="M128 400 C132 344 160 318 200 318 C240 318 268 344 272 400Z" fill="#c23b5e"/>
<path d="M176 320 L200 352 L224 320Z" fill="#f7e9ee"/>
<!-- 臉 -->
<ellipse cx="200" cy="212" rx="70" ry="80" fill="#fbe8e2"/>
<!-- 瀏海 -->
<path d="M128 196 C128 120 168 100 200 100 C232 100 272 120 272 196 C254 166 240 150 222 146 C214 168 196 176 176 170 C172 160 172 150 176 142 C160 152 140 170 128 196Z" fill="url(#hair)"/>
<!-- 眼睛(瞇眼笑) -->
<path d="M160 222 Q172 210 184 222" fill="none" stroke="#5a2a36" stroke-width="5" stroke-linecap="round"/>
<path d="M216 222 Q228 210 240 222" fill="none" stroke="#5a2a36" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="158" cy="246" rx="13" ry="7" fill="#f4a3b4" opacity=".7"/>
<ellipse cx="242" cy="246" rx="13" ry="7" fill="#f4a3b4" opacity=".7"/>
<path d="M188 258 Q200 268 212 258" fill="none" stroke="#a8455a" stroke-width="4" stroke-linecap="round"/>
<!-- 髮上的梅花 -->
<g fill="#e0365e"><use href="#plum" transform="translate(262 128) scale(1.6)"/></g>
<circle cx="262" cy="128" r="6" fill="#ffd36b"/>
<g fill="#f5788f"><use href="#plum" transform="translate(240 112) scale(.9)"/></g>
<circle cx="240" cy="112" r="3.5" fill="#ffd36b"/>
</svg>
